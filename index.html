<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>씨유에탑 | 26년 3월 고2 모의고사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c-primary:#2563EB;--c-primary-light:#EFF6FF;--c-primary-mid:#BFDBFE;
  --c-accent:#F59E0B;--c-success:#16A34A;--c-success-bg:#F0FDF4;
  --c-danger:#DC2626;--c-danger-bg:#FEF2F2;
  --c-text:#1E293B;--c-text-2:#475569;--c-text-3:#94A3B8;
  --c-bg:#F8FAFC;--c-surface:#FFFFFF;--c-border:#E2E8F0;--c-border-2:#CBD5E1;
  --radius-sm:8px;--radius-md:12px;--radius-lg:18px;--radius-xl:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--c-bg);font-family:"Noto Sans KR",sans-serif;color:var(--c-text)}
#app{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--c-bg)}
.header{background:var(--c-primary);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.header-logo .brand{font-family:"Nunito",sans-serif;font-weight:800;font-size:17px;color:#fff;letter-spacing:0.5px}
.header-logo .sub{font-size:11px;color:rgba(255,255,255,0.8);margin-top:1px;letter-spacing:0.3px}
.header-actions{display:flex;gap:6px}
.icon-btn{background:rgba(255,255,255,0.18);border:none;border-radius:var(--radius-sm);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:17px;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,0.28)}
.screen{display:none;flex:1;overflow-y:auto;padding-bottom:32px}
.screen.active{display:block}
.tabs-bar{display:flex;background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:0 8px}
.tab-item{flex:1;padding:11px 4px;text-align:center;font-size:13px;color:var(--c-text-3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-weight:500}
.tab-item.on{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.progress-section{padding:12px 16px 8px}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.prog-label{font-size:13px;color:var(--c-text-2);font-weight:500}
.prog-count{font-size:13px;color:var(--c-primary);font-weight:700}
.prog-bar{height:5px;background:var(--c-border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--c-primary);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.stats-mini{display:flex;gap:8px;padding:0 16px 12px}
.stat-pill{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--c-surface);border-radius:var(--radius-md);border:1px solid var(--c-border)}
.stat-pill .num{font-size:18px;font-weight:700;font-family:"Nunito",sans-serif}
.stat-pill .lbl{font-size:11px;color:var(--c-text-3);font-weight:500}
.stat-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.card-wrap{padding:0 16px 10px;perspective:1000px}
.flashcard{background:var(--c-surface);border-radius:var(--radius-xl);border:1px solid var(--c-border);padding:28px 24px 24px;min-height:230px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 2px 12px rgba(37,99,235,0.07)}
.flashcard:active{transform:scale(0.98)}
.fc-top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
.pos-badge{font-size:11px;font-weight:700;color:var(--c-primary);background:var(--c-primary-light);padding:3px 9px;border-radius:99px}
.fc-actions{display:flex;gap:6px}
.fc-btn{background:none;border:1px solid var(--c-border);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-text-3);font-size:15px;transition:all .15s}
.fc-btn:hover{border-color:var(--c-primary-mid);color:var(--c-primary)}
.fc-btn.fav-on{color:#EF4444;border-color:#FECACA;background:#FEF2F2}
.word-no{position:absolute;bottom:12px;right:16px;font-size:11px;color:var(--c-text-3);font-family:"Nunito",sans-serif}
.word-en{font-family:"Nunito",sans-serif;font-size:34px;font-weight:800;color:var(--c-text);text-align:center;letter-spacing:-0.5px}
.word-phon{font-size:14px;color:var(--c-text-3);text-align:center;letter-spacing:0.3px;font-family:"Nunito",sans-serif}
.word-kr{font-size:23px;font-weight:700;color:var(--c-primary);text-align:center;display:none;animation:fadeIn .2s}
.tap-hint{font-size:12px;color:var(--c-text-3);text-align:center;margin-top:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.swipe-hint{text-align:center;font-size:11px;color:var(--c-text-3);padding:0 0 8px}
.mark-row{display:flex;gap:8px;padding:0 16px 12px}
.mark-btn{flex:1;padding:11px 8px;border-radius:var(--radius-md);font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.mark-btn.known{background:var(--c-success-bg);border-color:#86EFAC;color:var(--c-success)}
.mark-btn.unknown{background:var(--c-danger-bg);border-color:#FCA5A5;color:var(--c-danger)}
.mark-btn.skip{background:var(--c-bg);border-color:var(--c-border);color:var(--c-text-2)}
.nav-row{display:flex;gap:8px;padding:0 16px}
.nav-btn{flex:1;padding:12px;border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--c-border);background:var(--c-surface);color:var(--c-text);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;font-family:"Noto Sans KR",sans-serif}
.nav-btn:hover{background:var(--c-primary-light);border-color:var(--c-primary-mid);color:var(--c-primary)}
.nav-btn.primary{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.nav-btn.primary:hover{background:#1D4ED8;border-color:#1D4ED8}
.nav-btn:disabled{opacity:0.35;cursor:default;pointer-events:none}
/* Quiz */
.quiz-body{padding:16px}
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.quiz-back{background:none;border:1.5px solid var(--c-border);border-radius:var(--radius-md);padding:7px 13px;font-size:13px;cursor:pointer;color:var(--c-text-2);font-family:"Noto Sans KR",sans-serif;font-weight:700;transition:all .15s}
.quiz-back:hover{border-color:var(--c-primary);color:var(--c-primary)}
.quiz-card{background:var(--c-surface);border-radius:var(--radius-xl);border:1px solid var(--c-border);padding:28px 20px 24px;text-align:center;margin-bottom:14px;box-shadow:0 2px 12px rgba(37,99,235,0.07)}
.qc-word{font-family:"Nunito",sans-serif;font-size:30px;font-weight:800;color:var(--c-text);margin-bottom:5px}
.qc-phon{font-size:13px;color:var(--c-text-3);margin-bottom:6px;font-family:"Nunito",sans-serif}
.qc-hint{font-size:12px;color:var(--c-text-3)}
.options{display:flex;flex-direction:column;gap:9px}
.opt-btn{padding:13px 16px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--radius-md);font-size:15px;cursor:pointer;text-align:left;transition:all .15s;color:var(--c-text);font-family:"Noto Sans KR",sans-serif;font-weight:500}
.opt-btn:hover:not(:disabled){background:var(--c-primary-light);border-color:var(--c-primary-mid)}
.opt-btn.correct{background:var(--c-success-bg);border-color:#86EFAC;color:var(--c-success)}
.opt-btn.wrong{background:var(--c-danger-bg);border-color:#FCA5A5;color:var(--c-danger)}
.opt-btn:disabled{cursor:default}
.quiz-next-btn{width:100%;margin-top:12px;padding:14px;background:var(--c-primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:700;cursor:pointer;font-family:"Noto Sans KR",sans-serif;display:none;transition:background .15s}
.quiz-next-btn:hover{background:#1D4ED8}
/* Result */
.result-body{padding:24px 16px}
.result-trophy{font-size:56px;text-align:center;margin-bottom:12px}
.result-score{font-family:"Nunito",sans-serif;font-size:52px;font-weight:800;text-align:center;color:var(--c-primary);margin-bottom:4px}
.result-msg{text-align:center;font-size:16px;color:var(--c-text-2);margin-bottom:24px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.result-card{background:var(--c-surface);border-radius:var(--radius-lg);border:1px solid var(--c-border);padding:16px;text-align:center}
.rc-num{font-family:"Nunito",sans-serif;font-size:28px;font-weight:800}
.rc-lbl{font-size:12px;color:var(--c-text-3);font-weight:500;margin-top:2px}
.result-btns{display:flex;flex-direction:column;gap:8px}
/* Search */
.search-bar{padding:10px 16px 8px;position:relative}
.search-bar input{width:100%;padding:10px 14px 10px 36px;border:1.5px solid var(--c-border);border-radius:var(--radius-md);font-size:14px;background:var(--c-surface);color:var(--c-text);font-family:"Noto Sans KR",sans-serif;outline:none;transition:border .15s}
.search-bar input:focus{border-color:var(--c-primary)}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--c-text-3);pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-logo">
      <div class="brand">씨유에탑 ✦ 영어단어장</div>
      <div class="sub">26년 3월 고2 모의고사 · 총 386단어</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="goQuiz()" title="퀴즈">✏️</button>
    </div>
  </div>

  <!-- STUDY -->
  <div class="screen active" id="screen-study">
    <div class="tabs-bar">
      <div class="tab-item on" onclick="setFilter('all',this)">전체</div>
      <div class="tab-item" onclick="setFilter('unknown',this)">모르는 단어</div>
      <div class="tab-item" onclick="setFilter('fav',this)">⭐ 즐겨찾기</div>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="단어 검색..." oninput="onSearch()">
    </div>
    <div class="progress-section">
      <div class="prog-row">
        <span class="prog-label" id="prog-label">학습 진도</span>
        <span class="prog-count" id="prog-count">1 / 386</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="stats-mini">
      <div class="stat-pill"><div class="dot" style="background:#16A34A"></div><div><div class="num" id="s-known" style="color:#16A34A">0</div><div class="lbl">알아요</div></div></div>
      <div class="stat-pill"><div class="dot" style="background:#DC2626"></div><div><div class="num" id="s-unknown" style="color:#DC2626">0</div><div class="lbl">모름</div></div></div>
      <div class="stat-pill"><div class="dot" style="background:#F59E0B"></div><div><div class="num" id="s-fav" style="color:#F59E0B">0</div><div class="lbl">즐겨찾기</div></div></div>
    </div>
    <div class="card-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="fc-top">
          <div class="pos-badge" id="fc-pos">n.</div>
          <div class="fc-actions">
            <button class="fc-btn" id="fav-btn" onclick="event.stopPropagation();toggleFav()" title="즐겨찾기">☆</button>
            <button class="fc-btn" onclick="event.stopPropagation();speak()" title="발음 듣기">🔊</button>
          </div>
        </div>
        <div class="word-en" id="fc-word">performance</div>
        <div class="word-phon" id="fc-phon">pərˈfɔːrməns</div>
        <div class="word-kr" id="fc-kr">공연, 실행</div>
        <div class="tap-hint" id="tap-hint">카드를 탭하면 뜻이 보여요 👆</div>
        <div class="word-no" id="word-no">1 / 386</div>
      </div>
    </div>
    <div class="swipe-hint">← → 버튼 또는 스와이프로 넘기기</div>
    <div class="mark-row" id="mark-row" style="display:none">
      <button class="mark-btn unknown" onclick="markWord('unknown')">✗ 모름</button>
      <button class="mark-btn skip" onclick="markWord('skip')">건너뜀</button>
      <button class="mark-btn known" onclick="markWord('known')">✓ 알아요</button>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev-btn" onclick="prevCard()">← 이전</button>
      <button class="nav-btn primary" id="next-btn" onclick="nextCard()">다음 →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-body">
      <div class="quiz-header">
        <button class="quiz-back" onclick="goStudy()">← 단어장</button>
        <span style="font-size:13px;font-weight:700;color:var(--c-text-2)" id="quiz-num">1 / 10</span>
      </div>
      <div class="progress-section" style="padding:0 0 14px">
        <div class="prog-bar"><div class="prog-fill" id="qprog-fill" style="width:0%"></div></div>
      </div>
      <div class="quiz-card">
        <div class="qc-word" id="qc-word">performance</div>
        <div class="qc-phon" id="qc-phon">pərˈfɔːrməns</div>
        <div class="qc-hint">올바른 뜻을 선택하세요</div>
      </div>
      <div class="options" id="options"></div>
      <button class="quiz-next-btn" id="qnext-btn" onclick="nextQuiz()">다음 문제 →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="result-body">
      <div class="result-trophy" id="r-trophy">🏆</div>
      <div class="result-score" id="r-score">80점</div>
      <div class="result-msg" id="r-msg">잘했어요!</div>
      <div class="result-grid">
        <div class="result-card"><div class="rc-num" id="rc-correct" style="color:#16A34A">0</div><div class="rc-lbl">정답</div></div>
        <div class="result-card"><div class="rc-num" id="rc-wrong" style="color:#DC2626">0</div><div class="rc-lbl">오답</div></div>
      </div>
      <div class="result-btns">
        <button class="nav-btn primary" onclick="startQuiz()">🔄 다시 풀기</button>
        <button class="nav-btn" onclick="goStudy()">📚 단어장으로</button>
      </div>
    </div>
  </div>
</div>

let allWords = WORDS.map(w=>({...w, fav:false, status:''}));
let filter='all', searchQ='', idx=0, flipped=false;
let quizWords=[], qIdx=0, qScore=0;

// 로컬스토리지 키
const STORE_KEY = 'cyatop_26mar_g2';

function save(){
  try{
    const state = allWords.map(w=>{return {w:w.w,fav:w.fav,status:w.status}});
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){}
}
function load(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(saved){
      saved.forEach(s=>{
        const w = allWords.find(x=>x.w===s.w);
        if(w){w.fav=s.fav;w.status=s.status;}
      });
    }
  }catch(e){}
}

// 터치 스와이프
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  if(!document.getElementById('screen-study').classList.contains('active'))return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)<50)return;
  if(dx<0)nextCard(); else prevCard();
},{passive:true});

function getFiltered(){
  let list = allWords;
  if(filter==='fav') list=list.filter(w=>w.fav);
  else if(filter==='unknown') list=list.filter(w=>w.status==='unknown');
  if(searchQ) list=list.filter(w=>w.w.toLowerCase().includes(searchQ)||w.m.includes(searchQ));
  return list;
}

function renderCard(){
  const list=getFiltered();
  if(!list.length){
    document.getElementById('fc-word').textContent='단어 없음';
    document.getElementById('fc-phon').textContent='';
    document.getElementById('fc-pos').textContent='';
    document.getElementById('fc-kr').style.display='none';
    document.getElementById('tap-hint').style.display='block';
    document.getElementById('mark-row').style.display='none';
    document.getElementById('prog-count').textContent='0 / 0';
    document.getElementById('prog-fill').style.width='0%';
    document.getElementById('word-no').textContent='';
    return;
  }
  if(idx>=list.length)idx=list.length-1;
  if(idx<0)idx=0;
  const w=list[idx];
  flipped=false;
  document.getElementById('fc-word').textContent=w.w;
  document.getElementById('fc-phon').textContent=w.p;
  document.getElementById('fc-pos').textContent=w.pos||'';
  document.getElementById('fc-kr').textContent=w.m;
  document.getElementById('fc-kr').style.display='none';
  document.getElementById('tap-hint').style.display='block';
  document.getElementById('mark-row').style.display='none';
  const fb=document.getElementById('fav-btn');
  fb.textContent=w.fav?'★':'☆';
  fb.classList.toggle('fav-on',!!w.fav);
  document.getElementById('prog-count').textContent=(idx+1)+' / '+list.length;
  document.getElementById('word-no').textContent=(idx+1)+' / '+list.length;
  document.getElementById('prog-fill').style.width=(((idx+1)/list.length)*100)+'%';
  document.getElementById('prev-btn').disabled=idx===0;
  document.getElementById('next-btn').disabled=idx===list.length-1;
  const k=allWords.filter(x=>x.status==='known').length;
  const u=allWords.filter(x=>x.status==='unknown').length;
  const f=allWords.filter(x=>x.fav).length;
  document.getElementById('s-known').textContent=k;
  document.getElementById('s-unknown').textContent=u;
  document.getElementById('s-fav').textContent=f;
  const done=allWords.filter(x=>x.status==='known'||x.status==='unknown').length;
  document.getElementById('prog-label').textContent='학습 진도 '+done+'/'+allWords.length;
}

function flipCard(){
  flipped=!flipped;
  document.getElementById('fc-kr').style.display=flipped?'block':'none';
  document.getElementById('tap-hint').style.display=flipped?'none':'block';
  document.getElementById('mark-row').style.display=flipped?'flex':'none';
  if(flipped)speak();
}

function speak(){
  const list=getFiltered();
  const w=list[idx];
  if(!w)return;
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(w.w);
    u.lang='en-US';u.rate=0.85;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }
}

function toggleFav(){
  const list=getFiltered();
  const w=list[idx];if(!w)return;
  w.fav=!w.fav;save();
  renderCard();
  if(filter==='fav'){idx=Math.min(idx,getFiltered().length-1);renderCard();}
}

function markWord(s){
  const list=getFiltered();
  const w=list[idx];if(!w)return;
  w.status=s;save();
  const l=getFiltered();
  if(filter!=='all'&&idx>=l.length)idx=Math.max(0,l.length-1);
  else if(idx<(filter==='all'?allWords.length-1:l.length-1))idx++;
  renderCard();
}

function prevCard(){if(idx>0){idx--;renderCard();}}
function nextCard(){const l=getFiltered();if(idx<l.length-1){idx++;renderCard();}}

function setFilter(f,el){
  filter=f;idx=0;
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderCard();
}

function onSearch(){
  searchQ=document.getElementById('search-input').value.toLowerCase().trim();
  idx=0;renderCard();
}

function showScreen(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
}

function goStudy(){showScreen('study');renderCard();}
function goQuiz(){if(allWords.length<2){alert('단어가 부족해요!');return;}startQuiz();}

function startQuiz(){
  quizWords=[...allWords].sort(()=>Math.random()-0.5).slice(0,Math.min(10,allWords.length));
  qIdx=0;qScore=0;showScreen('quiz');renderQuiz();
}

function renderQuiz(){
  if(qIdx>=quizWords.length){showResult();return;}
  const q=quizWords[qIdx];
  document.getElementById('qc-word').textContent=q.w;
  document.getElementById('qc-phon').textContent=q.p;
  document.getElementById('quiz-num').textContent=(qIdx+1)+' / '+quizWords.length;
  document.getElementById('qprog-fill').style.width=(((qIdx+1)/quizWords.length)*100)+'%';
  document.getElementById('qnext-btn').style.display='none';
  const wrong=allWords.filter(x=>x.w!==q.w).sort(()=>Math.random()-0.5).slice(0,3);
  const opts=[...wrong.map(x=>x.m),q.m].sort(()=>Math.random()-0.5);
  document.getElementById('options').innerHTML=opts.map(o=>
    `<button class="opt-btn" onclick="checkAns(this,'${o.replace(/'/g,"\'")}',${JSON.stringify(q.m)})">${o}</button>`
  ).join('');
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(q.w);u.lang='en-US';u.rate=0.85;
    speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),200);
  }
}

function checkAns(btn,chosen,correct){
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(chosen===correct){btn.classList.add('correct');qScore++;}
  else{
    btn.classList.add('wrong');
    document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
  }
  document.getElementById('qnext-btn').style.display='block';
}

function nextQuiz(){qIdx++;renderQuiz();}

function showResult(){
  showScreen('result');
  const total=quizWords.length;
  const pct=Math.round(qScore/total*100);
  document.getElementById('r-score').textContent=pct+'점';
  document.getElementById('rc-correct').textContent=qScore;
  document.getElementById('rc-wrong').textContent=total-qScore;
  const trophies=['😢','😅','🙂','😊','🎉','🏆'];
  const msgs=['다시 도전!','조금 더 공부해봐요!','잘하고 있어요!','꽤 잘했어요!','거의 완벽해요!','완벽해요! 🏆'];
  const lvl=Math.min(5,Math.floor(pct/20));
  document.getElementById('r-trophy').textContent=trophies[lvl];
  document.getElementById('r-msg').textContent=msgs[lvl];
}

load();
renderCard();
</script>
</body>
</html>
