<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>씨유에탑 수특 11강-16강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563EB;
  --primary-light: #EFF6FF;
  --primary-dark: #1D4ED8;
  --success: #16A34A;
  --success-light: #F0FDF4;
  --danger: #DC2626;
  --danger-light: #FEF2F2;
  --warning: #D97706;
  --warning-light: #FFFBEB;
  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-500: #6B7280;
  --gray-700: #374151;
  --gray-900: #111827;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--gray-50);
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
  color: var(--gray-900);
}

/* HEADER */
.header {
  background: var(--primary);
  padding: 18px 16px 14px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(37,99,235,0.3);
}
.brand {
  font-family: 'Nunito', sans-serif;
  font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,0.75);
  letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 2px;
}
.header-title {
  font-size: 16px; font-weight: 700;
  color: #fff; line-height: 1.3;
}
.header-sub {
  font-size: 12px; color: rgba(255,255,255,0.8);
  margin-top: 2px;
}
.progress-bar-wrap {
  margin-top: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 99px; height: 5px; overflow: hidden;
}
.progress-bar {
  background: #fff; border-radius: 99px;
  height: 100%; transition: width 0.4s ease;
}
.progress-stats {
  display: flex; justify-content: space-between;
  margin-top: 5px; font-size: 10.5px;
  color: rgba(255,255,255,0.75);
}

/* TABS */
.tabs {
  display: flex; background: #fff;
  border-bottom: 1px solid var(--gray-200);
  position: sticky; top: 88px; z-index: 90;
  overflow-x: auto;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; padding: 10px 14px;
  font-size: 12.5px; font-weight: 600;
  color: var(--gray-500); cursor: pointer;
  border-bottom: 2.5px solid transparent;
  white-space: nowrap; transition: all 0.2s;
  font-family: 'Nunito', sans-serif;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* SEARCH */
.search-wrap {
  padding: 10px 12px;
  background: #fff; border-bottom: 1px solid var(--gray-100);
}
.search-input {
  width: 100%; padding: 9px 12px 9px 36px;
  border: 1.5px solid var(--gray-200); border-radius: 99px;
  font-size: 13px; outline: none; font-family: 'Noto Sans KR';
  background: var(--gray-50);
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--primary); background: #fff; }
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 22px; top: 50%;
  transform: translateY(-50%); color: var(--gray-500);
  font-size: 14px; pointer-events: none;
}

/* FILTER TABS */
.filter-tabs {
  display: flex; gap: 6px; padding: 10px 12px;
  background: #fff; border-bottom: 1px solid var(--gray-100);
  overflow-x: auto;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.ftab {
  flex: none; padding: 5px 12px; border-radius: 99px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  border: 1.5px solid var(--gray-200);
  color: var(--gray-700); background: #fff;
  transition: all 0.2s; font-family: 'Nunito', sans-serif;
}
.ftab.active {
  background: var(--primary); color: #fff; border-color: var(--primary);
}

/* WORD LIST */
.word-list { padding: 8px 12px 80px; }
.word-card {
  background: #fff; border-radius: var(--radius);
  border: 1.5px solid var(--gray-100);
  margin-bottom: 8px; overflow: hidden;
  box-shadow: var(--shadow); transition: box-shadow 0.2s;
}
.word-card-header {
  display: flex; align-items: center;
  padding: 12px 14px; gap: 10px; cursor: pointer;
}
.word-card-header:active { background: var(--gray-50); }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--gray-200); transition: background 0.2s;
}
.status-dot.know { background: var(--success); }
.status-dot.dunno { background: var(--danger); }
.word-main { flex: 1; min-width: 0; }
.word-en {
  font-family: 'Nunito', sans-serif;
  font-size: 15.5px; font-weight: 700;
  color: var(--gray-900); line-height: 1.2;
}
.word-phonetic {
  font-size: 11px; color: var(--gray-500);
  margin-top: 1px; font-style: italic;
}
.word-pos-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 99px;
  background: var(--primary-light); color: var(--primary);
  font-family: 'Nunito', sans-serif; flex-shrink: 0;
}
.fav-btn {
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  transition: transform 0.2s;
}
.fav-btn:active { transform: scale(1.3); }
.speak-btn {
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  color: var(--gray-500); padding: 2px;
}

.word-meaning-reveal {
  background: var(--primary-light);
  border-top: 1.5px solid var(--gray-100);
  padding: 10px 14px;
  display: none;
}
.word-meaning-reveal.open { display: block; }
.word-meaning-text {
  font-size: 14.5px; font-weight: 700;
  color: var(--primary-dark); line-height: 1.5;
}
.word-status-btns {
  display: flex; gap: 6px; margin-top: 8px;
}
.ws-btn {
  flex: 1; padding: 6px 0; border-radius: 99px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  border: 1.5px solid; text-align: center;
  font-family: 'Nunito', sans-serif; transition: all 0.15s;
}
.ws-btn:active { transform: scale(0.96); }
.ws-btn.know { border-color: var(--success); color: var(--success); background: var(--success-light); }
.ws-btn.dunno { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
.ws-btn.skip { border-color: var(--gray-300); color: var(--gray-500); background: #fff; }
.ws-btn.active-know { background: var(--success); color: #fff; border-color: var(--success); }
.ws-btn.active-dunno { background: var(--danger); color: #fff; border-color: var(--danger); }

/* FLASHCARD VIEW */
.flashcard-view {
  display: none;
  padding: 16px 12px 80px;
}
.flashcard-view.active { display: block; }
.fc-counter {
  text-align: center; font-size: 13px;
  color: var(--gray-500); font-family: 'Nunito', sans-serif;
  font-weight: 700; margin-bottom: 12px;
}
.fc-card {
  background: #fff; border-radius: 20px;
  padding: 36px 20px 28px;
  box-shadow: var(--shadow-md);
  text-align: center; cursor: pointer;
  min-height: 220px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
  border: 1.5px solid var(--gray-100);
  user-select: none;
}
.fc-word {
  font-family: 'Nunito', sans-serif;
  font-size: 28px; font-weight: 800;
  color: var(--primary); margin-bottom: 6px;
  line-height: 1.2;
}
.fc-phonetic {
  font-size: 13px; color: var(--gray-500);
  font-style: italic; margin-bottom: 8px;
}
.fc-pos { font-size: 12px; color: var(--gray-500); }
.fc-speak {
  position: absolute; top: 14px; right: 16px;
  font-size: 22px; cursor: pointer; color: var(--primary);
}
.fc-fav {
  position: absolute; top: 14px; left: 16px;
  font-size: 22px; cursor: pointer;
}
.fc-meaning {
  margin-top: 16px; padding: 14px 16px;
  background: var(--primary-light); border-radius: 12px;
  width: 100%;
}
.fc-meaning-text {
  font-size: 16px; font-weight: 700;
  color: var(--primary-dark); text-align: center;
}
.fc-hint {
  font-size: 12px; color: var(--gray-500);
  margin-top: 10px;
}
.fc-actions {
  display: flex; gap: 8px; margin-top: 16px;
}
.fc-btn {
  flex: 1; padding: 12px 0; border-radius: 12px;
  font-size: 13.5px; font-weight: 700; cursor: pointer;
  border: none; font-family: 'Nunito', sans-serif;
  transition: all 0.15s;
}
.fc-btn:active { transform: scale(0.96); }
.fc-btn.know { background: var(--success); color: #fff; }
.fc-btn.dunno { background: var(--danger); color: #fff; }
.fc-btn.skip { background: var(--gray-100); color: var(--gray-700); }
.fc-nav {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 14px;
}
.fc-nav-btn {
  padding: 8px 20px; background: var(--gray-100);
  border-radius: 99px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'Nunito', sans-serif;
  color: var(--gray-700); transition: all 0.15s;
  border: none;
}
.fc-nav-btn:active { background: var(--gray-200); }
.fc-swipe-hint {
  text-align: center; font-size: 11px;
  color: var(--gray-500); margin-top: 8px;
}

/* QUIZ VIEW */
.quiz-view {
  display: none;
  padding: 16px 12px 80px;
}
.quiz-view.active { display: block; }
.quiz-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 16px;
}
.quiz-progress { font-size: 13px; color: var(--gray-500); font-family: 'Nunito', sans-serif; font-weight: 700; }
.quiz-score-badge {
  background: var(--primary-light); color: var(--primary);
  padding: 4px 12px; border-radius: 99px;
  font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif;
}
.quiz-word {
  background: var(--primary); color: #fff;
  border-radius: 16px; padding: 24px 20px;
  text-align: center; margin-bottom: 16px;
}
.quiz-word-text {
  font-family: 'Nunito', sans-serif;
  font-size: 26px; font-weight: 800; margin-bottom: 6px;
}
.quiz-word-ph { font-size: 13px; opacity: 0.8; font-style: italic; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  padding: 14px 16px; border-radius: 12px;
  border: 1.5px solid var(--gray-200);
  background: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: left;
  transition: all 0.15s; font-family: 'Noto Sans KR';
}
.quiz-opt:active { transform: scale(0.98); }
.quiz-opt.correct { background: var(--success-light); border-color: var(--success); color: var(--success); }
.quiz-opt.wrong { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.quiz-next {
  margin-top: 14px; width: 100%;
  padding: 13px; background: var(--primary); color: #fff;
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: 'Nunito', sans-serif; display: none;
  transition: background 0.2s;
}
.quiz-next:active { background: var(--primary-dark); }

/* QUIZ RESULT */
.quiz-result {
  display: none; text-align: center;
  padding: 20px 0;
}
.quiz-result.show { display: block; }
.result-emoji { font-size: 56px; margin-bottom: 10px; }
.result-score {
  font-family: 'Nunito', sans-serif;
  font-size: 42px; font-weight: 800; color: var(--primary);
}
.result-label { font-size: 15px; color: var(--gray-500); margin-bottom: 20px; }
.result-msg { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
.result-retry {
  padding: 13px 32px; background: var(--primary); color: #fff;
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: 'Nunito', sans-serif;
}

/* LIST VIEW */
.list-view { display: none; }
.list-view.active { display: block; }

/* FLOATING BTN */
.float-quiz-btn {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--primary); color: #fff;
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; box-shadow: 0 4px 16px rgba(37,99,235,0.4);
  cursor: pointer; z-index: 200;
  transition: transform 0.2s;
}
.float-quiz-btn:active { transform: scale(0.9); }

.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--gray-500);
}
.empty-state .icon { font-size: 40px; margin-bottom: 8px; }
.empty-state p { font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">씨유에탑 ✦ 영어단어장</div>
  <div class="header-title">수능특강 11강–16강</div>
  <div class="header-sub">동의어/반의어 포함 · 총 <span id="totalCount">0</span>단어</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-stats">
    <span>✅ <span id="knowCount">0</span> 알아요</span>
    <span>❌ <span id="dunnoCount">0</span> 모름</span>
    <span>⭐ <span id="favCount">0</span> 즐겨찾기</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchView('list')" id="tabList">📋 단어목록</div>
  <div class="tab" onclick="switchView('flash')" id="tabFlash">🃏 플래시카드</div>
  <div class="tab" onclick="switchView('quiz')" id="tabQuiz">📝 퀴즈</div>
</div>

<!-- LIST VIEW -->
<div class="list-view active" id="listView">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="search" placeholder="단어 또는 뜻 검색..." oninput="renderList()">
  </div>
  <div class="filter-tabs">
    <div class="ftab active" onclick="setFilter('all')" id="ftAll">전체</div>
    <div class="ftab" onclick="setFilter('dunno')" id="ftDunno">모르는 단어</div>
    <div class="ftab" onclick="setFilter('fav')" id="ftFav">⭐ 즐겨찾기</div>
  </div>
  <div class="word-list" id="wordList"></div>
</div>

<!-- FLASHCARD VIEW -->
<div class="flashcard-view" id="flashView">
  <div class="fc-counter" id="fcCounter">0 / 0</div>
  <div class="fc-card" id="fcCard" onclick="revealMeaning()">
    <span class="fc-fav" id="fcFav" onclick="event.stopPropagation();toggleFavFC()">🤍</span>
    <button class="fc-speak" onclick="event.stopPropagation();speakFC()" title="발음">🔊</button>
    <div class="fc-word" id="fcWord">-</div>
    <div class="fc-phonetic" id="fcPhonetic">-</div>
    <div class="fc-pos" id="fcPos">-</div>
    <div class="fc-hint" id="fcHint">탭하면 뜻이 보여요 👆</div>
  </div>
  <div id="fcMeaningWrap" style="display:none; margin-top:10px;">
    <div class="fc-meaning">
      <div class="fc-meaning-text" id="fcMeaning">-</div>
    </div>
    <div class="fc-actions">
      <button class="fc-btn dunno" onclick="markFC('dunno')">❌ 모름</button>
      <button class="fc-btn skip" onclick="nextFC()">건너뜀</button>
      <button class="fc-btn know" onclick="markFC('know')">✅ 알아요</button>
    </div>
  </div>
  <div class="fc-nav">
    <button class="fc-nav-btn" onclick="prevFC()">← 이전</button>
    <div class="fc-swipe-hint">좌우 스와이프로 이동</div>
    <button class="fc-nav-btn" onclick="nextFC()">다음 →</button>
  </div>
  <div class="filter-tabs" style="margin-top:12px;">
    <div class="ftab active" onclick="setFCFilter('all')" id="fcftAll">전체</div>
    <div class="ftab" onclick="setFCFilter('dunno')" id="fcftDunno">모르는 단어</div>
    <div class="ftab" onclick="setFCFilter('fav')" id="fcftFav">⭐ 즐겨찾기</div>
  </div>
</div>

<!-- QUIZ VIEW -->
<div class="quiz-view" id="quizView">
  <div id="quizContent">
    <div class="quiz-header">
      <div class="quiz-progress" id="quizProgress">1 / 10</div>
      <div class="quiz-score-badge" id="quizScoreBadge">점수: 0</div>
    </div>
    <div class="quiz-word" id="quizWordBox">
      <div class="quiz-word-text" id="quizWordText">-</div>
      <div class="quiz-word-ph" id="quizWordPh">-</div>
    </div>
    <div class="quiz-options" id="quizOptions"></div>
    <button class="quiz-next" id="quizNext" onclick="nextQuiz()">다음 문제 →</button>
  </div>
  <div class="quiz-result" id="quizResult">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-score" id="resultScore">0/10</div>
    <div class="result-label">점수</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="result-retry" onclick="startQuiz()">다시 풀기 🔄</button>
  </div>
</div>

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      words = WORDS_RAW.map((w, i) => ({
        ...w,
        fav: state[i]?.fav || false,

    } else {
      words = WORDS_RAW.map(w => ({...w, fav: false, status: ''}));
    }
  } catch(e) {
    words = WORDS_RAW.map(w => ({...w, fav: false, status: ''}));

function saveState() {
  const state = words.map(w => ({fav: w.fav, status: w.status}));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateHeader();
}

function updateHeader() {
  const know = words.filter(w => w.status === 'know').length;
  const dunno = words.filter(w => w.status === 'dunno').length;
  const fav = words.filter(w => w.fav).length;
  const done = know + dunno;
  document.getElementById('knowCount').textContent = know;
  document.getElementById('dunnoCount').textContent = dunno;
  document.getElementById('favCount').textContent = fav;
  document.getElementById('totalCount').textContent = words.length;
  document.getElementById('progressBar').style.width = (done/words.length*100) + '%';
}

function getFilteredWords() {
  const q = document.getElementById('searchInput')?.value?.toLowerCase() || '';

    const matchFilter = currentFilter === 'all' ? true :
      currentFilter === 'dunno' ? w.status === 'dunno' :
      currentFilter === 'fav' ? w.fav : true;
    const matchSearch = !q || w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

function setFilter(f) {

    const realIdx = words.indexOf(w);
    return `<div class="word-card" id="card_${realIdx}">
      <div class="word-card-header" onclick="toggleCard(${realIdx})">
        <div class="status-dot ${w.status}"></div>
        <div class="word-main">
          <div class="word-en">${w.word}</div>
          ${w.phonetic ? `<div class="word-phonetic">${w.phonetic}</div>` : ''}
        </div>
        ${w.pos ? `<div class="word-pos-badge">${w.pos}</div>` : ''}
        <span class="fav-btn" onclick="event.stopPropagation();toggleFav(${realIdx})">${w.fav ? '⭐' : '🤍'}</span>
        <span class="speak-btn" onclick="event.stopPropagation();speak('${w.word}')">🔊</span>
      </div>
      <div class="word-meaning-reveal" id="reveal_${realIdx}">
        <div class="word-meaning-text">${w.meaning}</div>
        <div class="word-status-btns">
          <button class="ws-btn know ${w.status==='know'?'active-know':''}" onclick="setStatus(${realIdx},'know')">✅ 알아요</button>
          <button class="ws-btn skip" onclick="closeCard(${realIdx})">건너뜀</button>
          <button class="ws-btn dunno ${w.status==='dunno'?'active-dunno':''}" onclick="setStatus(${realIdx},'dunno')">❌ 모름</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(idx) {
  const reveal = document.getElementById('reveal_'+idx);
  const isOpen = reveal.classList.contains('open');
  // Close all
  document.querySelectorAll('.word-meaning-reveal.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) {
    reveal.classList.add('open');
    speak(words[idx].word);
  }
}

function closeCard(idx) {
  document.getElementById('reveal_'+idx)?.classList.remove('open');
}

function toggleFav(idx) {
  words[idx].fav = !words[idx].fav;
  saveState();
  renderList();
}

function setStatus(idx, status) {
  words[idx].status = words[idx].status === status ? '' : status;
  saveState();
  renderList();
  // Auto-advance
  setTimeout(() => closeCard(idx), 300);
}

function speak(text) {
  if (!text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(e) {}
}

// FLASHCARD
function buildFCDeck() {
  fcDeck = fcFilter === 'all' ? [...words] :
    fcFilter === 'dunno' ? words.filter(w => w.status === 'dunno') :
    fcFilter === 'fav' ? words.filter(w => w.fav) : [...words];
  if (!fcDeck.length && fcFilter !== 'all') {
    fcDeck = [...words];
  }
  fcIdx = 0;
}

function setFCFilter(f) {
  fcFilter = f;
  ['all','dunno','fav'].forEach(x => document.getElementById('fcft'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active', x===f));
  buildFCDeck();
  showFC();
}

function showFC() {
  if (!fcDeck.length) return;
  const w = fcDeck[fcIdx];
  document.getElementById('fcWord').textContent = w.word;
  document.getElementById('fcPhonetic').textContent = w.phonetic || '';
  document.getElementById('fcPos').textContent = w.pos || '';
  document.getElementById('fcMeaning').textContent = w.meaning;
  document.getElementById('fcFav').textContent = w.fav ? '⭐' : '🤍';
  document.getElementById('fcHint').style.display = 'block';
  document.getElementById('fcMeaningWrap').style.display = 'none';
  document.getElementById('fcCounter').textContent = (fcIdx+1) + ' / ' + fcDeck.length;
  fcMeaningShown = false;
  speak(w.word);
}

function revealMeaning() {
  if (fcMeaningShown) return;
  fcMeaningShown = true;
  document.getElementById('fcMeaningWrap').style.display = 'block';
  document.getElementById('fcHint').style.display = 'none';
  speak(fcDeck[fcIdx].word);
}

function speakFC() {
  speak(fcDeck[fcIdx]?.word);
}

function toggleFavFC() {
  if (!fcDeck.length) return;
  const w = fcDeck[fcIdx];
  const realIdx = words.indexOf(w);
  if (realIdx >= 0) {
    words[realIdx].fav = !words[realIdx].fav;
    fcDeck[fcIdx].fav = words[realIdx].fav;
    saveState();
    document.getElementById('fcFav').textContent = fcDeck[fcIdx].fav ? '⭐' : '🤍';
  }
}

function markFC(status) {
  if (!fcDeck.length) return;
  const w = fcDeck[fcIdx];
  const realIdx = words.indexOf(w);
  if (realIdx >= 0) {
    words[realIdx].status = words[realIdx].status === status ? '' : status;
    saveState();
  }
  nextFC();
}

function nextFC() {
  if (!fcDeck.length) return;
  fcIdx = (fcIdx + 1) % fcDeck.length;
  showFC();
}

function prevFC() {
  if (!fcDeck.length) return;
  fcIdx = (fcIdx - 1 + fcDeck.length) % fcDeck.length;
  showFC();
}

// Swipe for flashcard
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', e => {
  if (document.getElementById('flashView').classList.contains('active')) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx < 0 ? nextFC() : prevFC(); }
  }
}, {passive: true});

// QUIZ
function startQuiz() {
  const pool = words.filter(w => w.meaning);
  quizWords = pool.sort(() => Math.random()-0.5).slice(0, Math.min(10, pool.length));
  quizIdx = 0; quizScore = 0;
  document.getElementById('quizContent').style.display = 'block';
  document.getElementById('quizResult').classList.remove('show');
  showQuiz();
}

function getWrongOptions(correct, pool) {
  const others = pool.filter(w => w.meaning !== correct.meaning);
  const shuffled = others.sort(() => Math.random()-0.5).slice(0, 3);
  return shuffled.map(w => w.meaning);
}

function showQuiz() {
  if (quizIdx >= quizWords.length) { showResult(); return; }
  const w = quizWords[quizIdx];
  document.getElementById('quizProgress').textContent = (quizIdx+1) + ' / ' + quizWords.length;
  document.getElementById('quizScoreBadge').textContent = '점수: ' + quizScore;
  document.getElementById('quizWordText').textContent = w.word;
  document.getElementById('quizWordPh').textContent = w.phonetic || '';
  document.getElementById('quizNext').style.display = 'none';
  quizAnswered = false;
  speak(w.word);

  const pool = words.filter(x => x.meaning);
  const wrong = getWrongOptions(w, pool);
  const opts = [w.meaning, ...wrong].sort(() => Math.random()-0.5);

  const container = document.getElementById('quizOptions');
  container.innerHTML = opts.map(opt => `<div class="quiz-opt" onclick="answerQuiz(this,'${opt.replace(/'/g,"\'")}',${opt===w.meaning})">${opt}</div>`).join('');
}

function answerQuiz(el, ans, correct) {
  if (quizAnswered) return;
  quizAnswered = true;
  if (correct) {
    el.classList.add('correct');
    quizScore++;
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.quiz-opt').forEach(opt => {
      if (opt.textContent === quizWords[quizIdx].meaning) opt.classList.add('correct');
    });
  }
  speak(quizWords[quizIdx].word);
  document.getElementById('quizNext').style.display = 'block';
}

function nextQuiz() {
  quizIdx++;
  showQuiz();
}

function showResult() {
  document.getElementById('quizContent').style.display = 'none';
  const result = document.getElementById('quizResult');
  result.classList.add('show');
  const pct = quizScore / quizWords.length;
  document.getElementById('resultScore').textContent = quizScore + '/' + quizWords.length;
  document.getElementById('resultEmoji').textContent = pct >= 0.9 ? '🎉' : pct >= 0.7 ? '😊' : pct >= 0.5 ? '🙂' : '💪';
  document.getElementById('resultMsg').textContent = pct >= 0.9 ? '완벽해요!' : pct >= 0.7 ? '잘했어요!' : pct >= 0.5 ? '조금 더 연습해요!' : '다시 도전해 보세요!';
}

function switchView(view) {
  ['list','flash','quiz'].forEach(v => {
    document.getElementById(v+'View').classList.toggle('active', v===view);
    document.getElementById('tab'+v.charAt(0).toUpperCase()+v.slice(1)).classList.toggle('active', v===view);
  });
  if (view === 'flash') { buildFCDeck(); showFC(); }
  if (view === 'quiz') startQuiz();
}

// Init
loadState();
updateHeader();
renderList();
</script>
</body>
