<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta property="og:title" content="씨유에탑 ✦ 고1 미래엔 4과">
<title>씨유에탑 ✦ 고1 미래엔 4과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;--green:#16A34A;--red:#DC2626;--amber:#D97706;--amber-light:#FFFBEB;--purple:#7C3AED;--purple-light:#F5F3FF;--gray100:#F3F4F6;--gray200:#E5E7EB;--gray400:#9CA3AF;--gray600:#4B5563;--gray800:#1F2937;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08)}
body{font-family:'Nunito','Noto Sans KR',sans-serif;background:#F0F4FF;min-height:100vh;color:var(--gray800)}
.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--gray200);padding:10px 16px 0;box-shadow:0 2px 8px rgba(37,99,235,.07)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-size:13px;font-weight:800;color:var(--blue);letter-spacing:-.3px}
.subtitle{font-size:11px;color:var(--gray400);margin-top:1px}
.stats{display:flex;gap:8px;font-size:11px;font-weight:700}
.stat-ok{color:var(--green)}.stat-no{color:var(--red)}.stat-fav{color:#F59E0B}
.prog-wrap{height:4px;background:var(--gray100);border-radius:2px;margin-bottom:8px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--blue),#60A5FA);border-radius:2px;transition:width .4s}
.tabs{display:flex;border-bottom:2px solid var(--gray200)}
.tab-btn{flex:1;padding:8px 4px;font-size:13px;font-weight:700;border:none;background:none;cursor:pointer;color:var(--gray400);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.seg-wrap{position:sticky;top:var(--header-h,108px);z-index:90;background:#F0F4FF;padding:8px 12px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;border-bottom:1px solid var(--gray200)}
.seg-wrap::-webkit-scrollbar{display:none}
.seg-btn{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--gray200);background:#fff;color:var(--gray600);margin-right:6px;transition:all .15s}
.seg-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.mode-toggle{display:flex;background:var(--gray100);border-radius:20px;padding:3px;margin-bottom:12px}
.mode-btn{flex:1;padding:5px;border-radius:18px;border:none;font-size:11px;font-weight:700;cursor:pointer;color:var(--gray600);background:none}
.mode-btn.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--gray200);background:#fff;color:var(--gray600);cursor:pointer}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.search-box{width:100%;padding:9px 14px;border-radius:10px;border:1.5px solid var(--gray200);font-size:13px;font-family:inherit;margin-bottom:10px;outline:none;background:#fff}
.search-box:focus{border-color:var(--blue)}
.repeat-wrap{margin-left:auto;display:flex;gap:4px;align-items:center}
.rep-label{font-size:10px;color:var(--gray400);font-weight:700}
.rep-btn{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;border:1.5px solid var(--gray200);background:#fff;color:var(--gray600);cursor:pointer}
.rep-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.s-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;border:1.5px solid transparent;overflow:hidden;transition:border-color .15s}
.s-card.status-ok{border-color:var(--green)}.s-card.status-no{border-color:var(--red)}
.s-card-head{display:flex;align-items:center;gap:8px;padding:11px 14px}
.s-num{min-width:38px;height:32px;border-radius:8px;background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-align:center;line-height:1.2;padding:0 4px}
.s-preview{flex:1;font-size:12.5px;font-weight:600;line-height:1.5;color:var(--gray800);cursor:pointer}
.s-head-btns{display:flex;gap:4px;align-items:center;flex-shrink:0}
.s-speak-btn{background:var(--blue-light);border:none;cursor:pointer;font-size:14px;padding:5px 8px;border-radius:8px;color:var(--blue);font-weight:700}
.s-speak-btn:active{opacity:.7}
.s-chevron{font-size:14px;color:var(--gray400);cursor:pointer;padding:4px;background:none;border:none}
.s-body{padding:0 14px;max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s}
.s-body.open{max-height:3000px;padding-bottom:14px}
.full-passage{font-size:13px;font-weight:600;line-height:1.8;color:var(--gray800);padding-top:10px;margin-bottom:10px;border-top:1px solid var(--gray100)}
.full-trans{font-size:12.5px;color:var(--gray600);line-height:1.7;margin-bottom:8px}
.note-badge{font-size:11.5px;color:var(--amber);font-weight:600;background:var(--amber-light);padding:6px 10px;border-radius:7px;line-height:1.55}
.sent-list{padding-top:10px;border-top:1px solid var(--gray100)}
.sent-item{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1.5px solid var(--gray200)}
.sent-en-row{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;cursor:pointer;background:var(--blue-light)}
.sent-idx{font-size:10px;font-weight:800;color:var(--blue);min-width:20px;padding-top:2px;flex-shrink:0}
.sent-en-text{flex:1;font-size:12.5px;font-weight:700;line-height:1.65;color:var(--gray800)}
.sent-spk{background:#fff;border:none;cursor:pointer;font-size:14px;padding:4px 7px;border-radius:7px;flex-shrink:0;color:var(--blue);font-weight:700}
.sent-spk:active{opacity:.7}
.sent-detail{padding:10px 12px;display:none}
.sent-detail.open{display:block}
.sent-ko{font-size:12px;color:var(--gray600);line-height:1.65;margin-bottom:7px}
.sent-gram{font-size:11px;color:var(--purple);font-weight:600;background:var(--purple-light);padding:5px 9px;border-radius:6px;line-height:1.6}
.s-actions{display:flex;gap:6px;align-items:center;padding:10px 14px 12px;flex-wrap:wrap;border-top:1px solid var(--gray100)}
.act-btn{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--gray200);background:#fff;cursor:pointer;transition:all .15s}
.act-ok{color:var(--green);border-color:var(--green)}.act-ok.sel{background:var(--green);color:#fff}
.act-no{color:var(--red);border-color:var(--red)}.act-no.sel{background:var(--red);color:#fff}
.act-skip{color:var(--gray400)}.act-skip.sel{background:var(--gray100)}
.act-fav{font-size:17px;background:none;border:none;cursor:pointer;padding:4px;margin-left:auto}
.flash-wrap{display:flex;flex-direction:column}
.flash-card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(37,99,235,.12);padding:18px 16px 16px;flex:1;display:flex;flex-direction:column;min-height:260px;border:2px solid transparent;transition:border-color .2s}
.flash-card.status-ok{border-color:var(--green)}.flash-card.status-no{border-color:var(--red)}
.flash-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.flash-num{height:32px;border-radius:10px;background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 10px}
.flash-top-btns{display:flex;gap:6px;align-items:center}
.flash-spk{background:var(--blue);border:none;cursor:pointer;font-size:13px;padding:7px 12px;border-radius:10px;color:#fff;font-weight:700}
.flash-spk:active{opacity:.8}
.flash-fav{background:none;border:none;cursor:pointer;font-size:18px;padding:4px}
.flash-en{font-size:13px;font-weight:700;line-height:1.8;color:var(--gray800);flex:1;cursor:pointer}
.flash-hint{font-size:11px;color:var(--gray400);margin-top:14px;text-align:center;cursor:pointer;padding:8px;border:1.5px dashed var(--gray200);border-radius:8px}
.flash-reveal{margin-top:14px;border-top:1px solid var(--gray100);padding-top:12px}
.flash-ko{font-size:12.5px;color:var(--gray600);line-height:1.65;margin-bottom:8px}
.flash-note{font-size:11px;color:var(--amber);font-weight:600;background:var(--amber-light);padding:5px 9px;border-radius:6px}
.flash-sent-item{margin-bottom:7px;border-radius:9px;overflow:hidden;border:1.5px solid var(--gray200)}
.flash-sent-en-row{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;background:var(--blue-light);cursor:pointer}
.flash-sent-idx{font-size:10px;font-weight:800;color:var(--blue);min-width:18px;padding-top:1px;flex-shrink:0}
.flash-sent-en{flex:1;font-size:12px;font-weight:700;line-height:1.6;color:var(--gray800)}
.flash-sent-spk{background:#fff;border:none;cursor:pointer;font-size:13px;padding:3px 6px;border-radius:6px;flex-shrink:0;color:var(--blue)}
.flash-sent-spk:active{opacity:.7}
.flash-sent-detail{padding:8px 10px;display:none}
.flash-sent-detail.open{display:block}
.flash-sent-ko{font-size:11.5px;color:var(--gray600);line-height:1.6;margin-bottom:5px}
.flash-sent-gram{font-size:10.5px;color:var(--purple);font-weight:600;background:var(--purple-light);padding:4px 8px;border-radius:5px;line-height:1.55}
.flash-nav{display:flex;align-items:center;gap:8px;margin-top:12px}
.nav-btn{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .15s}
.nav-prev{background:var(--gray100);color:var(--gray600)}.nav-next{background:var(--blue);color:#fff}
.nav-btn:active{opacity:.8}
.flash-counter{font-size:12px;color:var(--gray400);font-weight:700;text-align:center;min-width:54px}
.flash-actions{display:flex;gap:6px;margin-top:10px}
.fa-btn{flex:1;padding:9px;border-radius:12px;font-size:12px;font-weight:700;border:1.5px solid;cursor:pointer;transition:all .15s}
.fa-ok{color:var(--green);border-color:var(--green);background:#fff}.fa-ok.sel{background:var(--green);color:#fff}
.fa-no{color:var(--red);border-color:var(--red);background:#fff}.fa-no.sel{background:var(--red);color:#fff}
.fa-skip{color:var(--gray400);border-color:var(--gray200);background:#fff}.fa-skip.sel{background:var(--gray100)}
.rep-playing{display:flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;background:var(--blue-light);border-radius:8px;font-size:11px;font-weight:700;color:var(--blue)}
.rep-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.empty-msg{text-align:center;padding:40px;color:var(--gray400);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="header" id="mainHeader">
  <div class="header-top">
    <div>
      <div class="brand">씨유에탑 ✦ 문장외우기</div>
      <div class="subtitle">고1 미래엔 4과 · 총 10단위 (47문장)</div>
    </div>
    <div class="stats">
      <span class="stat-ok">✅ <span id="cntOk">0</span></span>
      <span class="stat-no">❌ <span id="cntNo">0</span></span>
      <span class="stat-fav">⭐ <span id="cntFav">0</span></span>
    </div>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('list')">📋 지문목록</button>
    <button class="tab-btn" onclick="switchTab('flash')">🃏 플래시카드</button>
  </div>
</div>
<div class="seg-wrap" id="segWrap"></div>
<div id="list-tab" style="padding:10px 12px 80px"></div>
<div id="flash-tab" style="padding:10px 12px 80px;display:none"></div>

<script>
const SENTENCES_RAW = [{"number": 1, "label": "1~5번째 문장", "translation": "낭만적인 휴일을 위한 완벽한 여행지를 찾고 있나요? 그렇다면 독일 남부의 로맨틱 가도를 찾아보세요. 이 길은 전 세계 관광객들에게 인기 있는 장소이다. 로맨틱 가도의 역사는 로마 제국 시대로 거슬러 올라가는데, 원래 무역과 교통을 위해 건설되었다. 제2차 세계대전 중에 파괴된 후, 그 도로와 주변 도시들이 재건되었다.", "note": "Are you looking for ~: 현재진행형 의문문 / look no further than: ~이상 찾지 마라 (관용표현) / a favorite among: ~사이에서 인기 있는 것", "sentences": [{"en": "Are you looking for the perfect destination for romantic holidays?", "ko": "낭만적인 휴일을 위한 완벽한 여행지를 찾고 있나요?", "gram": "Are you looking for ~: 현재진행형 의문문 / destination for: ~을 위한 여행지"}, {"en": "Then look no further than the Romantic Road in southern Germany.", "ko": "그렇다면 독일 남부의 로맨틱 가도를 찾아보세요.", "gram": "look no further than: ~이상 찾지 마라 (관용표현) / 명령문"}, {"en": "This trail is a favorite among tourists from all over the world.", "ko": "이 길은 전 세계 관광객들에게 인기 있는 장소이다.", "gram": "a favorite among: ~사이에서 인기 있는 것 / from all over the world: 전 세계에서"}, {"en": "The history of the Romantic Road dates back to the Roman Empire, as it was originally built for trade and transportation.", "ko": "로맨틱 가도의 역사는 로마 제국 시대로 거슬러 올라가는데, 원래 무역과 교통을 위해 건설되었다.", "gram": "date back to: ~로 거슬러 올라가다 / as: ~이므로 (이유 접속사) / be built for: ~을 위해 건설되다"}, {"en": "After being destroyed during World War II, the road and the surrounding cities were reconstructed.", "ko": "제2차 세계대전 중에 파괴된 후, 그 도로와 주변 도시들이 재건되었다.", "gram": "After being p.p.: ~된 후 (수동 동명사) / were reconstructed: 수동태"}]}, {"number": 2, "label": "6~10번째 문장", "translation": "그 결과가 바로 로맨틱 가도이며, 이 이름은 '로만 로드(Roman Road)'에서 유래했다. 오늘날 그곳은 매년 수많은 방문객을 끌어들인다. 로맨틱 가도를 여행하는 동안 내가 방문한 세 곳의 놀라운 장소를 여러분과 나누고 싶다. \"만약 내가 출생지를 선택할 수 있다면, 나는 뷔르츠부르크를 고려할 것이다\"라고 저명한 작가 헤르만 헤세가 썼다. 매력적인 중세 도시를 거닐고 나면 그 이유를 쉽게 알 수 있다.", "note": "which was derived from: 계속적 관계대명사 / attract: 끌어들이다 / share A with B: A를 B와 나누다", "sentences": [{"en": "The result was the Romantic Road, which was derived from the name \"Roman Road.\"", "ko": "그 결과가 바로 로맨틱 가도이며, 이 이름은 '로만 로드(Roman Road)'에서 유래했다.", "gram": "which was derived from: 계속적 관계대명사 / be derived from: ~에서 유래하다"}, {"en": "Today it attracts tons of visitors every year.", "ko": "오늘날 그곳은 매년 수많은 방문객을 끌어들인다.", "gram": "attract: 끌어들이다 / tons of: 수많은 (구어체 표현)"}, {"en": "I want to share with you three amazing spots I visited while on the Romantic Road.", "ko": "로맨틱 가도를 여행하는 동안 내가 방문한 세 곳의 놀라운 장소를 여러분과 나누고 싶다.", "gram": "share A with B: A를 B와 나누다 / I visited: 목적격 관계대명사 생략 / while on: ~하는 동안"}, {"en": "\"If I could choose my place of birth, I would consider Würzburg,\" wrote the renowned author Hermann Hesse.", "ko": "\"만약 내가 출생지를 선택할 수 있다면, 나는 뷔르츠부르크를 고려할 것이다\"라고 저명한 작가 헤르만 헤세가 썼다.", "gram": "가정법 과거: If I could ~, I would ~ / 도치: wrote the renowned author (동사+주어)"}, {"en": "It's easy to see why after taking a stroll around the charming, medieval town.", "ko": "매력적인 중세 도시를 거닐고 나면 그 이유를 쉽게 알 수 있다.", "gram": "It is easy to V: 가주어-진주어 / after taking a stroll: 전치사+동명사"}]}, {"number": 3, "label": "11~15번째 문장", "translation": "도착하자마자, 성 킬리안 대성당의 두 탑이 당신을 맞이한다. 그리고 탑에서 도보 5분 이내에 유네스코 세계문화유산인 뷔르츠부르크 레지덴츠가 궁정 정원과 레지덴츠 광장과 함께 완전히 모습을 드러낼 것이다. 이 아름다운 궁전은 오스트리아, 프랑스, 이탈리아, 독일 출신의 18세기 가장 저명한 건축가와 예술가들에 의해 지어졌다. 더욱 여유로운 경험을 위해, 마인 강변을 따라 산책하며 스카이라인 너머로 지는 태양을 감상해 보라. 그곳은 훌륭한 사진 명소여서 나는 일몰 동안 몇 장을 찍었다.", "note": "Upon arrival: 도착하자마자 (upon + 명사) / within a five-minute walk: 도보 5분 이내에 / was built by: 수동태", "sentences": [{"en": "Upon arrival, the two towers of St. Kilian Cathedral welcome you.", "ko": "도착하자마자, 성 킬리안 대성당의 두 탑이 당신을 맞이한다.", "gram": "Upon arrival: 도착하자마자 (upon + 명사) / 현재시제로 생생함 표현"}, {"en": "And within a five-minute walk of the towers, the Würzburg Residence, a UNESCO World Heritage Site, will be on full display with Court Gardens and Residence Square.", "ko": "그리고 탑에서 도보 5분 이내에 유네스코 세계문화유산인 뷔르츠부르크 레지덴츠가 궁정 정원과 레지덴츠 광장과 함께 완전히 모습을 드러낼 것이다.", "gram": "within a five-minute walk: 도보 5분 이내에 / 동격: a UNESCO World Heritage Site / on full display: 완전히 전시되어"}, {"en": "This beautiful palace was built by the most prominent architects and spired an opera by Wagner.", "ko": "'새로운 백조의 성'을 의미하는 '노이슈반슈타인'이라는 이름은 백조의 기사 전설에서 유래했으며, 이것이 바그너의 오페라에 영감을 주었다는 점은 주목할 만하다.", "gram": "It is worth -ing: ~할 가치가 있다 / meaning ~: 현재분사 후치수식 / which inspired: 계속적 관계대명사"}, {"en": "As we come to the end of our journey on the Romantic Road, I hope you've enjoyed traveling with me.", "ko": "로맨틱 가도 여행의 끝에 다다르면서, 저와 함께 여행하는 것을 즐기셨기를 바랍니다.", "gram": "As: ~하면서 (시간 접속사) / hope + that절 / you've enjoyed: 현재완료"}, {"en": "The Romantic Road offers a unique blend of history, culture, and outstanding natural beauty that will leave you with unforgettable memories, whatever the next stop of your travels may be.", "ko": "로맨틱 가도는 역사, 문화, 뛰어난 자연미의 독특한 조화를 제공하여 다음 여행지가 어디이든 잊을 수 없는 추억을 남길 것이다.", "gram": "a unique blend of: ~의 독특한 조화 / that will leave: 주격 관계대명사 / whatever ~ may be: 복합관계부사 (양보)"}]}, {"number": 10, "label": "46~47번째 문장", "translation": "기억하세요, 삶은 여행이고, 모든 여행은 한 걸음으로 시작됩니다. 오늘 그 첫걸음을 내딛고 로맨틱 가도 탐험을 고려해 보세요!", "note": "명령문: Remember / 명령문 병렬: Take ~ and consider ~", "sentences": [{"en": "Remember, life is a journey, and every journey begins with a single step.", "ko": "기억하세요, 삶은 여행이고, 모든 여행은 한 걸음으로 시작됩니다.", "gram": "명령문: Remember / every + 단수명사 + 단수동사 / begin with: ~으로 시작하다"}, {"en": "Take that step today and consider exploring the Romantic Road!", "ko": "오늘 그 첫걸음을 내딛고 로맨틱 가도 탐험을 고려해 보세요!", "gram": "명령문 병렬: Take ~ and consider ~ / consider -ing: ~하는 것을 고려하다"}]}];
let state={},favs={},curSeg='all',curTab='list';

let _voices=[],_repeatTimer=null,_isPlaying=false;
function _warmVoices(){
  if(!window.speechSynthesis)return;
  _voices=speechSynthesis.getVoices();
  if(!_voices.length){speechSynthesis.onvoiceschanged=()=>{_voices=speechSynthesis.getVoices();};}
}
function stopSpeak(){
  if(_repeatTimer){clearTimeout(_repeatTimer);_repeatTimer=null;}
  if(window.speechSynthesis)speechSynthesis.cancel();
  _isPlaying=false;
  document.querySelectorAll('.rep-playing').forEach(el=>el.remove());
}
function speak(text,repeatN){
  stopSpeak();
  if(!window.speechSynthesis)return;
  const n=repeatN!==undefined?repeatN:repeatCount;
  _isPlaying=true;let count=0;
  function playOne(){
    if(!_isPlaying||count>=n){_isPlaying=false;return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=0.85;
    const vv=_voices.length?_voices:speechSynthesis.getVoices();
    const v=vv.find(x=>x.lang==='en-US')||vv.find(x=>x.lang.startsWith('en'));
    if(v)u.voice=v;
    u.onend=()=>{count++;if(count<n&&_isPlaying){_repeatTimer=setTimeout(playOne,600);}
      else{_isPlaying=false;document.querySelectorAll('.rep-playing').forEach(el=>el.remove());}};
    u.onerror=()=>{_isPlaying=false;};
    speechSynthesis.speak(u);
  }
  playOne();
}
function showRepIndicator(container,n){
  document.querySelectorAll('.rep-playing').forEach(el=>el.remove());
  if(n<=1||!container)return;
  const div=document.createElement('div');div.className='rep-playing';
  div.innerHTML='<span class="rep-dot"></span> '+n+'회 반복 재생 중... <button onclick="stopSpeak()" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:13px;color:var(--blue)">⏹</button>';
  container.appendChild(div);
}

}

  if(curSeg==='all')return SENTENCES_RAW;
  const keys=curSeg.split(',').map(Number);
  return SENTENCES_RAW.filter(s=>keys.includes(s.number));
}
function applyFilter(arr,f){
  if(f==='no')return arr.filter(s=>state[s.number]==='no'||!state[s.number]);
  if(f==='fav')return arr.filter(s=>favs[s.number]);
  return arr;
}
function updateHeaderH(){
  const h=document.getElementById('mainHeader').offsetHeight;
  document.getElementById('segWrap').style.top=h+'px';
  document.documentElement.style.setProperty('--header-h',h+'px');
}
function updateStats(){
  let ok=0,no=0,fav=0;
  SENTENCES_RAW.forEach(s=>{if(state[s.number]==='ok')ok++;else if(state[s.number]==='no')no++;if(favs[s.number])fav++;});
  document.getElementById('cntOk').textContent=ok;
  document.getElementById('cntNo').textContent=no;
  document.getElementById('cntFav').textContent=fav;
  const pct=SENTENCES_RAW.length?Math.round((ok+no)/SENTENCES_RAW.length*100):0;
  document.getElementById('progBar').style.width=pct+'%';
}
function renderSegBar(){
  document.getElementById('segWrap').innerHTML=getSegments().map(s=>
    '<button class="seg-btn'+(curSeg===s.key?' active':'')+'" onclick="setSeg(\''+s.key+'\')">'+s.label+'</button>'
  ).join('');
}
function setSeg(k){curSeg=k;flashIdx=0;flashRevealed=false;stopSpeak();save();renderSegBar();renderCurrent();}
function switchTab(tab){
  stopSpeak();curTab=tab;
  ['list','flash'].forEach(t=>document.getElementById(t+'-tab').style.display=t===tab?'':'none');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['list','flash'][i]===tab));
  flashIdx=0;flashRevealed=false;renderCurrent();
}
function renderCurrent(){if(curTab==='list')renderList();else renderFlash();}
function repeatBtnsHtml(){
  return '<div class="repeat-wrap"><span class="rep-label">반복</span>'+[1,3,5].map(n=>'<button class="rep-btn'+(repeatCount===n?' active':'')+'" onclick="setRepeat('+n+')">'+n+'회</button>').join('')+'</div>';
}
function setRepeat(n){repeatCount=n;stopSpeak();save();renderCurrent();}

function renderList(){
  const tab=document.getElementById('list-tab');
  const prevSearch=tab.querySelector('.search-box')?.value||'';
  const arr=applyFilter(getFiltered(),listFilter);
  const search=prevSearch.trim().toLowerCase();
  const filtered=arr.filter(s=>!search||
    s.sentences.some(x=>x.en.toLowerCase().includes(search)||x.ko.toLowerCase().includes(search))||
    s.translation.toLowerCase().includes(search));
  let html='<div class="mode-toggle">'
    +'<button class="mode-btn'+(listMode==='problem'?' active':'')+'" onclick="setListMode(\'problem\')">📄 묶음 전체</button>'
    +'<button class="mode-btn'+(listMode==='sentence'?' active':'')+'" onclick="setListMode(\'sentence\')">📝 문장 분해</button>'
    +'</div>'
    +'<input class="search-box" id="listSearch" placeholder="🔍 영어/한국어 검색..." value="'+prevSearch.replace(/"/g,'&quot;')+'">'
    +'<div class="filter-row">'
    +'<button class="filter-btn'+(listFilter==='all'?' active':'')+'" onclick="setListFilter(\'all\')">전체</button>'
    +'<button class="filter-btn'+(listFilter==='no'?' active':'')+'" onclick="setListFilter(\'no\')">❌ 미완료</button>'
    +'<button class="filter-btn'+(listFilter==='fav'?' active':'')+'" onclick="setListFilter(\'fav\')">⭐ 즐겨찾기</button>'
    +repeatBtnsHtml()+'</div>';
  if(!filtered.length){html+='<div class="empty-msg">해당하는 내용이 없습니다.</div>';}
  else filtered.forEach(s=>{
    const st=state[s.number]||'',isFav=favs[s.number];
    const preview=s.sentences[0]?.en.slice(0,60)||'';
    html+='<div class="s-card'+(st?' status-'+st:'')+'" id="sc-'+s.number+'">'
      +'<div class="s-card-head">'
      +'<div class="s-num">Unit<br>'+s.number+'</div>'
      +'<div class="s-preview" onclick="toggleCard('+s.number+')">'+preview+(s.sentences[0]?.en.length>60?'…':'')+'</div>'
      +'<div class="s-head-btns">'
      +'<button class="s-speak-btn" onclick="event.stopPropagation();speakCard('+s.number+',this)">🔊</button>'
      +'<button class="s-chevron" id="sci-'+s.number+'" onclick="toggleCard('+s.number+')">▾</button>'
      +'</div></div>'
      +'<div class="s-body" id="sb-'+s.number+'">';
    if(listMode==='problem'){
      html+='<div class="full-passage">'+s.sentences.map(x=>x.en).join(' ')+'</div>'
        +'<div class="full-trans">'+s.translation+'</div>'
        +(s.note?'<div class="note-badge">📌 '+s.note+'</div>':'');
    } else {
      html+='<div class="sent-list">';
      s.sentences.forEach((sent,i)=>{
        html+='<div class="sent-item">'
          +'<div class="sent-en-row" onclick="toggleSent('+s.number+','+i+')">'
          +'<div class="sent-idx">['+(i+1)+']</div>'
          +'<div class="sent-en-text">'+sent.en+'</div>'
          +'<button class="sent-spk" onclick="event.stopPropagation();speakSent('+JSON.stringify(sent.en)+',this)">🔊</button>'
          +'</div>'
          +'<div class="sent-detail" id="sd-'+s.number+'-'+i+'">'
          +'<div class="sent-ko">'+sent.ko+'</div>'
          +(sent.gram?'<div class="sent-gram">📐 '+sent.gram+'</div>':'')
          +'</div></div>';
      });
      html+='</div>';
    }
    html+='</div>'
      +'<div class="s-actions">'
      +'<button class="act-btn act-ok'+(st==='ok'?' sel':'')+'" onclick="setState('+s.number+',\'ok\')">✅ 외웠어요</button>'
      +'<button class="act-btn act-no'+(st==='no'?' sel':'')+'" onclick="setState('+s.number+',\'no\')">❌ 모름</button>'
      +'<button class="act-btn act-skip'+(st==='skip'?' sel':'')+'" onclick="setState('+s.number+',\'skip\')">⤵ 건너뜀</button>'
      +'<button class="act-fav" onclick="toggleFav('+s.number+')">'+(isFav?'⭐':'☆')+'</button>'
      +'</div></div>';
  });
  tab.innerHTML=html;
  const box=document.getElementById('listSearch');
  if(box){box.value=prevSearch;box.addEventListener('input',renderList);}
}
function speakCard(num,btn){
  const s=SENTENCES_RAW.find(x=>x.number===num);if(!s)return;
  const text=s.sentences.map(x=>x.en).join(' ');
  speak(text);
  if(repeatCount>1)showRepIndicator(btn.closest('.s-card')?.querySelector('.s-actions'),repeatCount);
}
function speakSent(text,btn){speak(text);if(repeatCount>1)showRepIndicator(btn.closest('.sent-item'),repeatCount);}
function toggleCard(num){
  const body=document.getElementById('sb-'+num),icon=document.getElementById('sci-'+num);
  if(!body)return;
  const isOpen=body.classList.toggle('open');
  icon.textContent=isOpen?'▴':'▾';
  if(isOpen){const s=SENTENCES_RAW.find(x=>x.number===num);if(s)speak(s.sentences.map(x=>x.en).join(' '));}
}
function toggleSent(num,idx){
  const detail=document.getElementById('sd-'+num+'-'+idx);if(!detail)return;
  const isOpen=detail.classList.toggle('open');
  if(isOpen){const s=SENTENCES_RAW.find(x=>x.number===num);if(s&&s.sentences[idx]){speak(s.sentences[idx].en);if(repeatCount>1)showRepIndicator(detail,repeatCount);}}
}
function setListMode(m){listMode=m;stopSpeak();renderList();}
function setListFilter(f){listFilter=f;stopSpeak();renderList();}
function setState(num,st){
  state[num]=st;save();updateStats();
  const card=document.getElementById('sc-'+num);if(!card)return;
  card.className='s-card'+(st?' status-'+st:'');
  card.querySelectorAll('.act-btn').forEach(b=>b.classList.remove('sel'));
  const btn=card.querySelector('.act-'+st);if(btn)btn.classList.add('sel');
}
function toggleFav(num){
  favs[num]=!favs[num];save();updateStats();
  document.querySelectorAll('#sc-'+num+' .act-fav').forEach(b=>b.textContent=favs[num]?'⭐':'☆');
}
function renderFlash(){
  const arr=applyFilter(getFiltered(),flashFilter);
  const tab=document.getElementById('flash-tab');
  if(!arr.length){tab.innerHTML='<div class="empty-msg">해당 내용이 없습니다.</div>';return;}
  if(flashIdx>=arr.length)flashIdx=0;
  const s=arr[flashIdx],st=state[s.number]||'',isFav=favs[s.number];
  const fullText=s.sentences.map(x=>x.en).join(' ');
  let revealHtml='';
  if(flashRevealed){
    if(flashMode==='problem'){
      revealHtml='<div class="flash-reveal"><div class="flash-ko">'+s.translation+'</div>'+(s.note?'<div class="flash-note">📌 '+s.note+'</div>':'')+'</div>';
    } else {
      revealHtml='<div class="flash-reveal">';
      s.sentences.forEach((sent,i)=>{
        revealHtml+='<div class="flash-sent-item">'
          +'<div class="flash-sent-en-row" onclick="toggleFlashSent('+i+')">'
          +'<div class="flash-sent-idx">['+(i+1)+']</div>'
          +'<div class="flash-sent-en">'+sent.en+'</div>'
          +'<button class="flash-sent-spk" onclick="event.stopPropagation();speak('+JSON.stringify(sent.en)+')">🔊</button>'
          +'</div>'
          +'<div class="flash-sent-detail" id="fsd-'+i+'">'
          +'<div class="flash-sent-ko">'+sent.ko+'</div>'
          +(sent.gram?'<div class="flash-sent-gram">📐 '+sent.gram+'</div>':'')
          +'</div></div>';
      });
      revealHtml+=(s.note?'<div class="flash-note" style="margin-top:8px">📌 '+s.note+'</div>':'')+'</div>';
    }
  }
  tab.innerHTML='<div class="mode-toggle">'
    +'<button class="mode-btn'+(flashMode==='problem'?' active':'')+'" onclick="setFlashMode(\'problem\')">📄 묶음 전체</button>'
    +'<button class="mode-btn'+(flashMode==='sentence'?' active':'')+'" onclick="setFlashMode(\'sentence\')">📝 문장 분해</button>'
    +'</div>'
    +'<div class="filter-row">'
    +'<button class="filter-btn'+(flashFilter==='all'?' active':'')+'" onclick="setFlashFilter(\'all\')">전체</button>'
    +'<button class="filter-btn'+(flashFilter==='no'?' active':'')+'" onclick="setFlashFilter(\'no\')">❌ 미완료</button>'
    +'<button class="filter-btn'+(flashFilter==='fav'?' active':'')+'" onclick="setFlashFilter(\'fav\')">⭐ 즐겨찾기</button>'
    +repeatBtnsHtml()+'</div>'
    +'<div class="flash-wrap">'
    +'<div class="flash-card'+(st?' status-'+st:'')+'" ontouchstart="swipeStart(event)" ontouchend="swipeEnd(event)">'
    +'<div class="flash-card-top">'
    +'<div class="flash-num">Unit '+s.number+' · '+s.label+'</div>'
    +'<div class="flash-top-btns">'
    +'<button class="flash-spk" onclick="event.stopPropagation();flashSpeak()">🔊'+(repeatCount>1?' ×'+repeatCount:'')+'</button>'
    +'<button class="flash-fav" onclick="event.stopPropagation();flashToggleFav()">'+(isFav?'⭐':'☆')+'</button>'
    +'</div></div>'
    +'<div class="flash-en" onclick="revealFlash()">'+fullText+'</div>'
    +(!flashRevealed?'<div class="flash-hint" onclick="revealFlash()">👆 탭하면 해석이 나타나요</div>':revealHtml)
    +'</div>'
    +'<div id="flashRepWrap"></div>'
    +'<div class="flash-nav">'
    +'<button class="nav-btn nav-prev" onclick="flashMove(-1)">◀ 이전</button>'
    +'<span class="flash-counter">'+(flashIdx+1)+' / '+arr.length+'</span>'
    +'<button class="nav-btn nav-next" onclick="flashMove(1)">다음 ▶</button>'
    +'</div>'
    +'<div class="flash-actions">'
    +'<button class="fa-btn fa-ok'+(st==='ok'?' sel':'')+'" onclick="flashSetState(\'ok\')">✅ 외웠어요</button>'
    +'<button class="fa-btn fa-no'+(st==='no'?' sel':'')+'" onclick="flashSetState(\'no\')">❌ 모름</button>'
    +'<button class="fa-btn fa-skip'+(st==='skip'?' sel':'')+'" onclick="flashSetState(\'skip\')">⤵ 건너뜀</button>'
    +'</div></div>';
}
function flashSpeak(){
  const arr=applyFilter(getFiltered(),flashFilter);if(!arr[flashIdx])return;
  speak(arr[flashIdx].sentences.map(x=>x.en).join(' '));
  if(repeatCount>1)showRepIndicator(document.getElementById('flashRepWrap'),repeatCount);
}
function toggleFlashSent(idx){
  const detail=document.getElementById('fsd-'+idx);if(!detail)return;
  const isOpen=detail.classList.toggle('open');
  if(isOpen){const arr=applyFilter(getFiltered(),flashFilter);const s=arr[flashIdx];if(s&&s.sentences[idx])speak(s.sentences[idx].en);}
}
function revealFlash(){
  if(!flashRevealed){
    flashRevealed=true;renderFlash();
    const arr=applyFilter(getFiltered(),flashFilter);
    if(arr[flashIdx]){speak(arr[flashIdx].sentences.map(x=>x.en).join(' '));if(repeatCount>1)showRepIndicator(document.getElementById('flashRepWrap'),repeatCount);}
  }
}
function flashMove(dir){
  const arr=applyFilter(getFiltered(),flashFilter);stopSpeak();
  flashIdx=(flashIdx+dir+arr.length)%arr.length;flashRevealed=false;renderFlash();
}
function flashSetState(st){const arr=applyFilter(getFiltered(),flashFilter);if(!arr[flashIdx])return;state[arr[flashIdx].number]=st;save();updateStats();renderFlash();}
function flashToggleFav(){const arr=applyFilter(getFiltered(),flashFilter);if(!arr[flashIdx])return;const n=arr[flashIdx].number;favs[n]=!favs[n];save();updateStats();renderFlash();}
function setFlashMode(m){flashMode=m;stopSpeak();renderFlash();}
function setFlashFilter(f){flashFilter=f;flashIdx=0;stopSpeak();renderFlash();}
function swipeStart(e){swipeStartX=e.touches[0].clientX;}
function swipeEnd(e){const dx=e.changedTouches[0].clientX-swipeStartX;if(Math.abs(dx)>50)flashMove(dx<0?1:-1);}
load();_warmVoices();renderSegBar();updateStats();renderList();
setTimeout(updateHeaderH,100);window.addEventListener('resize',updateHeaderH);
</script>
</body></html>
