<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>씨유에탑 · 화암고1 3과&4과 교과서</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563EB;
    --primary-light: #3B82F6;
    --primary-dark: #1D4ED8;
    --bg: #F0F4FF;
    --card-bg: #FFFFFF;
    --text: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --success: #10B981;
    --danger: #EF4444;
    --warning: #F59E0B;
    --skip: #94A3B8;
    --fav: #F59E0B;
    --radius: 18px;
    --shadow: 0 4px 24px rgba(37,99,235,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nunito', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app { width: 100%; max-width: 420px; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }

  /* HEADER */
  .header {
    background: var(--primary);
    color: white;
    padding: 18px 20px 14px;
    text-align: center;
    position: relative;
  }
  .header-brand { font-size: 11px; font-weight: 700; letter-spacing: 2px; opacity: 0.85; text-transform: uppercase; margin-bottom: 3px; }
  .header-title { font-size: 19px; font-weight: 900; letter-spacing: -0.3px; line-height: 1.2; }
  .header-sub { font-size: 12px; font-weight: 600; opacity: 0.8; margin-top: 3px; }

  /* PROGRESS */
  .progress-wrap { background: white; padding: 10px 20px; border-bottom: 1px solid var(--border); }
  .progress-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; }
  .progress-bar-bg { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 99px; transition: width 0.4s; }
  .stats-row { display: flex; gap: 12px; margin-top: 7px; }
  .stat { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* TABS */
  .tabs { display: flex; background: white; border-bottom: 1px solid var(--border); }
  .tab-btn { flex: 1; padding: 11px 0; font-size: 13px; font-weight: 800; border: none; background: none; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* FILTER + SEARCH */
  .toolbar { padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
  .filter-row { display: flex; gap: 6px; }
  .filter-btn { flex: 1; padding: 7px 6px; border-radius: 99px; border: 2px solid var(--border); background: white; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.15s; }
  .filter-btn.active { border-color: var(--primary); color: var(--primary); background: #EFF6FF; }
  .search-wrap { position: relative; }
  .search-input { width: 100%; padding: 9px 36px 9px 14px; border-radius: 12px; border: 2px solid var(--border); font-size: 13px; font-family: 'Nunito','Noto Sans KR',sans-serif; outline: none; transition: border 0.2s; background: white; }
  .search-input:focus { border-color: var(--primary); }
  .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text-muted); display: none; }

  /* WORD LIST */
  .word-list { flex: 1; overflow-y: auto; padding: 0 12px 20px; display: flex; flex-direction: column; gap: 8px; }
  .word-card {
    background: white;
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 2px solid transparent;
    position: relative;
  }
  .word-card:active { transform: scale(0.98); }
  .word-card.know { border-color: var(--success); background: #F0FDF4; }
  .word-card.dontknow { border-color: var(--danger); background: #FEF2F2; }
  .word-card.skip { border-color: var(--skip); background: #F8FAFC; }
  .word-num { font-size: 11px; font-weight: 800; color: var(--text-muted); min-width: 24px; }
  .word-main { flex: 1; min-width: 0; }
  .word-eng { font-size: 16px; font-weight: 800; color: var(--text); }
  .word-phonetic { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .word-kor { font-size: 13px; color: var(--text-muted); margin-top: 3px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; }
  .word-pos { font-size: 10px; background: #EFF6FF; color: var(--primary); padding: 2px 7px; border-radius: 99px; font-weight: 700; white-space: nowrap; }
  .word-actions { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .fav-btn { background: none; border: none; font-size: 18px; cursor: pointer; line-height: 1; }
  .speak-btn { background: none; border: none; font-size: 15px; cursor: pointer; color: var(--primary); }
  .status-badge { position: absolute; top: 8px; right: 42px; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 99px; }
  .status-badge.know { background: #D1FAE5; color: #065F46; }
  .status-badge.dontknow { background: #FEE2E2; color: #991B1B; }
  .status-badge.skip { background: #E2E8F0; color: #475569; }

  /* FLASHCARD */
  .flashcard-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px 16px 80px; }
  .fc-counter { font-size: 13px; font-weight: 800; color: var(--text-muted); margin-bottom: 12px; }
  .fc-card-area {
    width: 100%;
    perspective: 1000px;
    cursor: pointer;
    user-select: none;
  }
  .fc-card-inner {
    position: relative;
    width: 100%;
    min-height: 220px;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .fc-card-inner.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute; width: 100%; min-height: 220px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(37,99,235,0.13);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px;
    backface-visibility: hidden;
  }
  .fc-back { transform: rotateY(180deg); }
  .fc-front-word { font-size: 28px; font-weight: 900; color: var(--primary); text-align: center; }
  .fc-front-phonetic { font-size: 14px; color: var(--text-muted); margin-top: 8px; }
  .fc-front-pos { margin-top: 12px; font-size: 12px; background: #EFF6FF; color: var(--primary); padding: 3px 12px; border-radius: 99px; font-weight: 700; }
  .fc-hint { font-size: 12px; color: var(--text-muted); margin-top: 20px; font-weight: 600; }
  .fc-back-meaning { font-size: 26px; font-weight: 900; color: var(--text); text-align: center; font-family: 'Noto Sans KR', sans-serif; }
  .fc-back-word { font-size: 16px; color: var(--text-muted); margin-top: 10px; font-weight: 700; }
  .fc-speak { margin-top: 14px; background: var(--primary); color: white; border: none; border-radius: 99px; padding: 8px 22px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; }
  .fc-btn-row { display: flex; gap: 10px; margin-top: 16px; width: 100%; }
  .fc-action-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; font-size: 13px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; transition: opacity 0.15s; }
  .fc-action-btn:active { opacity: 0.8; }
  .btn-know { background: #D1FAE5; color: #065F46; }
  .btn-dontknow { background: #FEE2E2; color: #991B1B; }
  .btn-skip { background: #E2E8F0; color: #475569; }
  .fc-nav-row { display: flex; gap: 10px; margin-top: 10px; width: 100%; }
  .fc-nav-btn { flex: 1; padding: 10px; border-radius: 12px; border: 2px solid var(--border); background: white; font-size: 15px; cursor: pointer; font-weight: 800; color: var(--text-muted); font-family: 'Nunito', sans-serif; }

  /* QUIZ */
  .quiz-wrap { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding-bottom: 80px; }
  .quiz-q { background: white; border-radius: 20px; padding: 24px 20px 20px; box-shadow: var(--shadow); text-align: center; }
  .quiz-num { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; }
  .quiz-word { font-size: 26px; font-weight: 900; color: var(--primary); }
  .quiz-phonetic { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt { width: 100%; padding: 15px 18px; border-radius: 14px; border: 2px solid var(--border); background: white; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; font-family: 'Noto Sans KR','Nunito',sans-serif; transition: all 0.15s; color: var(--text); }
  .quiz-opt:active { transform: scale(0.98); }
  .quiz-opt.correct { border-color: var(--success); background: #D1FAE5; color: #065F46; }
  .quiz-opt.wrong { border-color: var(--danger); background: #FEE2E2; color: #991B1B; }
  .quiz-opt.reveal { border-color: var(--success); background: #D1FAE5; color: #065F46; }
  .quiz-start-btn { display: block; width: 100%; padding: 16px; border-radius: 16px; background: var(--primary); color: white; font-size: 16px; font-weight: 800; border: none; cursor: pointer; font-family: 'Nunito',sans-serif; margin-top: 8px; }
  .quiz-result { background: white; border-radius: 20px; padding: 32px 20px; box-shadow: var(--shadow); text-align: center; }
  .quiz-result-emoji { font-size: 52px; margin-bottom: 12px; }
  .quiz-result-score { font-size: 32px; font-weight: 900; color: var(--primary); }
  .quiz-result-label { font-size: 15px; color: var(--text-muted); margin-top: 6px; font-weight: 700; }
  .quiz-retry-btn { margin-top: 20px; display: block; width: 100%; padding: 14px; border-radius: 14px; background: var(--primary); color: white; font-size: 15px; font-weight: 800; border: none; cursor: pointer; font-family: 'Nunito',sans-serif; }

  .empty-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; font-weight: 700; }

  /* swipe */
  .touch-hint { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 8px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-brand">씨유에탑 ✦ 영어단어장</div>
    <div class="header-title">화암고1 3과 &amp; 4과 교과서</div>
    <div class="header-sub" id="header-sub">총 84단어</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">학습 진도</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-bar" style="width:0%"></div></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-dot" style="background:var(--success)"></div><span id="stat-know">알아요 0</span></div>
      <div class="stat"><div class="stat-dot" style="background:var(--danger)"></div><span id="stat-dont">모름 0</span></div>
      <div class="stat"><div class="stat-dot" style="background:var(--skip)"></div><span id="stat-skip">건너뜀 0</span></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('list')" id="tab-list">단어목록</button>
    <button class="tab-btn" onclick="showTab('flash')" id="tab-flash">플래시카드</button>
    <button class="tab-btn" onclick="showTab('quiz')" id="tab-quiz">퀴즈</button>
  </div>

  <!-- LIST TAB -->
  <div id="view-list">
    <div class="toolbar">
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all')" id="f-all">전체</button>
        <button class="filter-btn" onclick="setFilter('dontknow')" id="f-dontknow">모르는 단어</button>
        <button class="filter-btn" onclick="setFilter('fav')" id="f-fav">⭐ 즐겨찾기</button>
      </div>
      <div class="search-wrap">
        <input class="search-input" id="search-input" placeholder="영어 또는 한글로 검색..." oninput="onSearch(this.value)">
        <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
      </div>
    </div>
    <div class="word-list" id="word-list"></div>
  </div>

  <!-- FLASH TAB -->
  <div id="view-flash" style="display:none" class="flashcard-wrap">
    <div class="fc-counter" id="fc-counter"></div>
    <div class="fc-card-area" id="fc-area" ontouchstart="fcTouchStart(event)" ontouchend="fcTouchEnd(event)">
      <div class="fc-card-inner" id="fc-inner">
        <div class="fc-face fc-front" id="fc-front">
          <div class="fc-front-word" id="fc-word"></div>
          <div class="fc-front-phonetic" id="fc-phonetic"></div>
          <div class="fc-front-pos" id="fc-pos"></div>
          <div class="fc-hint">탭하면 뜻이 보여요</div>
        </div>
        <div class="fc-face fc-back" id="fc-back">
          <div class="fc-back-meaning" id="fc-meaning"></div>
          <div class="fc-back-word" id="fc-back-word"></div>
          <button class="fc-speak" onclick="speakCurrent()">🔊 발음 듣기</button>
        </div>
      </div>
    </div>
    <div class="touch-hint">← 스와이프로 이전/다음 →</div>
    <div class="fc-btn-row">
      <button class="fc-action-btn btn-know" onclick="markCard('know')">✅ 알아요</button>
      <button class="fc-action-btn btn-dontknow" onclick="markCard('dontknow')">❌ 모름</button>
      <button class="fc-action-btn btn-skip" onclick="markCard('skip')">⏭ 건너뜀</button>
    </div>
    <div class="fc-nav-row">
      <button class="fc-nav-btn" onclick="fcNav(-1)">◀ 이전</button>
      <button class="fc-nav-btn" onclick="fcNav(1)">다음 ▶</button>
    </div>
  </div>

  <!-- QUIZ TAB -->
  <div id="view-quiz" style="display:none">
    <div id="quiz-inner"></div>
  </div>
</div>

  {word:"take into account",phonetic:"teɪk ˈɪntuː əˈkaʊnt",meaning:"~을 고려하다",pos:"동사구"},
  {word:"compound",phonetic:"ˈkɑːmpaʊnd",meaning:"화합물",pos:"명사"},
  {word:"measure",phonetic:"ˈmeʒər",meaning:"조치",pos:"명사"},
  {word:"in action",phonetic:"ɪn ˈækʃn",meaning:"활동 중인",pos:"형용사구"},
  {word:"collaborate",phonetic:"kəˈlæbəreɪt",meaning:"협력하다",pos:"동사"},
  {word:"process",phonetic:"ˈprɑːses",meaning:"과정",pos:"명사"},
  {word:"impurity",phonetic:"ɪmˈpjʊrəti",meaning:"불순물",pos:"명사"},
  {word:"fertilizer",phonetic:"ˈfɜːrtəlaɪzər",meaning:"비료",pos:"명사"},
  {word:"transform",phonetic:"trænsˈfɔːrm",meaning:"변형시키다",pos:"동사"},
  {word:"produce",phonetic:"prəˈduːs",meaning:"생산하다",pos:"동사"},
  {word:"repurpose",phonetic:"riːˈpɜːrpəs",meaning:"다른 목적에 맞게 고치다",pos:"동사"},
  {word:"in this manner",phonetic:"ɪn ðɪs ˈmænər",meaning:"이런 방식으로",pos:"부사구"},
  {word:"a wide range of",phonetic:"ə waɪd reɪndʒ ʌv",meaning:"다양한",pos:"형용사구"},
  {word:"log",phonetic:"lɔːɡ",meaning:"통나무",pos:"명사"},
  {word:"fabric",phonetic:"ˈfæbrɪk",meaning:"직물",pos:"명사"},
  {word:"absorb",phonetic:"əbˈsɔːrb",meaning:"흡수하다",pos:"동사"},
  {word:"appealing",phonetic:"əˈpiːlɪŋ",meaning:"매력적인",pos:"형용사"},
  {word:"appearance",phonetic:"əˈpɪrəns",meaning:"외견",pos:"명사"},
  {word:"preserve",phonetic:"prɪˈzɜːrv",meaning:"보존하다",pos:"동사"},
  {word:"take steps",phonetic:"teɪk steps",meaning:"조치를 취하다",pos:"동사구"},
  {word:"sustainable",phonetic:"səˈsteɪnəbl",meaning:"지속 가능한",pos:"형용사"},
  {word:"dedicate A to B",phonetic:"ˈdedɪkeɪt eɪ tuː biː",meaning:"A를 B에 바치다",pos:"동사구"},
  {word:"encourage",phonetic:"ɪnˈkɜːrɪdʒ",meaning:"장려하다",pos:"동사"}
];

const STORE_KEY = 'cutop_hwaam_g1_ch34';
let words = [];
let filter = 'all';
let searchQ = '';
let fcIndex = 0;
let fcFlipped = false;
let fcFiltered = [];
let quizState = null;
let touchStartX = 0;

function loadState() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return null;
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(words.map(w => ({status:w.status, fav:w.fav})))) } catch(e) {}
}
function init() {
  const saved = loadState();
  words = RAW.map((w, i) => ({
    ...w,
    fav: saved && saved[i] ? saved[i].fav : false,
    status: saved && saved[i] ? saved[i].status : ''
  }));
  updateStats();
  renderList();
}

function updateStats() {
  const know = words.filter(w=>w.status==='know').length;
  const dont = words.filter(w=>w.status==='dontknow').length;
  const skip = words.filter(w=>w.status==='skip').length;
  const total = words.length;
  const done = know + dont + skip;
  const pct = Math.round(done / total * 100);
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('stat-know').textContent = '알아요 ' + know;
  document.getElementById('stat-dont').textContent = '모름 ' + dont;
  document.getElementById('stat-skip').textContent = '건너뜀 ' + skip;
}

function getFiltered() {
  let list = words;
  if (filter === 'dontknow') list = list.filter(w => w.status === 'dontknow');
  else if (filter === 'fav') list = list.filter(w => w.fav);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(w => w.word.toLowerCase().includes(q) || w.meaning.includes(q));
  }
  return list;
}

function renderList() {
  const list = getFiltered();
  const el = document.getElementById('word-list');
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-msg">표시할 단어가 없습니다</div>';
    return;
  }
  el.innerHTML = list.map((w, i) => {
    const globalIdx = words.indexOf(w);
    const statusClass = w.status ? ' ' + w.status : '';
    const statusBadge = w.status ? `<span class="status-badge ${w.status}">${w.status==='know'?'✅ 알아요':w.status==='dontknow'?'❌ 모름':'⏭ 건너뜀'}</span>` : '';
    return `<div class="word-card${statusClass}" onclick="toggleCardStatus(${globalIdx})">
      <span class="word-num">${globalIdx+1}</span>
      <div class="word-main">
        <div class="word-eng">${w.word}</div>
        <div class="word-phonetic">${w.phonetic}</div>
        <div class="word-kor">${w.meaning}</div>
      </div>
      <span class="word-pos">${w.pos}</span>
      ${statusBadge}
      <div class="word-actions">
        <button class="fav-btn" onclick="toggleFav(event,${globalIdx})">${w.fav?'⭐':'☆'}</button>
        <button class="speak-btn" onclick="speak(event,'${w.word.replace(/'/g,"\\'")}')">🔊</button>
      </div>
    </div>`;
  }).join('');
}

function toggleCardStatus(idx) {
  const cycle = ['','know','dontknow','skip'];
  const cur = cycle.indexOf(words[idx].status);
  words[idx].status = cycle[(cur+1)%cycle.length];
  saveState(); updateStats(); renderList();
}
function toggleFav(e, idx) {
  e.stopPropagation();
  words[idx].fav = !words[idx].fav;
  saveState(); renderList();
}
function speak(e, word) {
  if(e) e.stopPropagation();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function setFilter(f) {
  filter = f;
  ['all','dontknow','fav'].forEach(x => document.getElementById('f-'+x).classList.toggle('active', x===f));
  renderList();
  if(document.getElementById('view-flash').style.display!=='none') initFlash();
}
function onSearch(v) {
  searchQ = v;
  document.getElementById('search-clear').style.display = v ? 'block' : 'none';
  renderList();
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQ = '';
  document.getElementById('search-clear').style.display = 'none';
  renderList();
}

function showTab(t) {
  ['list','flash','quiz'].forEach(x => {
    document.getElementById('view-'+x).style.display = x===t ? (x==='list'?'block':'flex') : 'none';
    document.getElementById('tab-'+x).classList.toggle('active', x===t);
  });
  if(t==='quiz') document.getElementById('view-quiz').style.display='block';
  if(t==='flash') { document.getElementById('view-flash').style.display='flex'; initFlash(); }
  if(t==='quiz') renderQuizStart();
}

// FLASHCARD
function initFlash() {
  fcFiltered = getFiltered();
  if(fcIndex >= fcFiltered.length) fcIndex = 0;
  fcFlipped = false;
  renderFlash();
}
function renderFlash() {
  if(fcFiltered.length === 0) {
    document.getElementById('fc-counter').textContent = '단어 없음';
    document.getElementById('fc-word').textContent = '-';
    document.getElementById('fc-phonetic').textContent = '';
    document.getElementById('fc-meaning').textContent = '-';
    return;
  }
  const w = fcFiltered[fcIndex];
  document.getElementById('fc-counter').textContent = (fcIndex+1) + ' / ' + fcFiltered.length;
  document.getElementById('fc-word').textContent = w.word;
  document.getElementById('fc-phonetic').textContent = w.phonetic;
  document.getElementById('fc-pos').textContent = w.pos;
  document.getElementById('fc-meaning').textContent = w.meaning;
  document.getElementById('fc-back-word').textContent = w.word;
  const inner = document.getElementById('fc-inner');
  inner.classList.toggle('flipped', fcFlipped);
}
document.getElementById('fc-area').addEventListener('click', function(e) {
  if(e.target.tagName==='BUTTON') return;
  fcFlipped = !fcFlipped;
  document.getElementById('fc-inner').classList.toggle('flipped', fcFlipped);
  if(fcFlipped && fcFiltered[fcIndex]) {
    setTimeout(()=>speak(null, fcFiltered[fcIndex].word), 300);
  }
});
function speakCurrent() {
  if(fcFiltered[fcIndex]) speak(null, fcFiltered[fcIndex].word);
}
function markCard(status) {
  if(!fcFiltered[fcIndex]) return;
  const globalIdx = words.indexOf(fcFiltered[fcIndex]);
  if(globalIdx >= 0) { words[globalIdx].status = status; saveState(); updateStats(); }
  fcNav(1);
}
function fcNav(dir) {
  fcFiltered = getFiltered();
  if(fcFiltered.length===0) return;
  fcIndex = (fcIndex + dir + fcFiltered.length) % fcFiltered.length;
  fcFlipped = false;
  renderFlash();
}
function fcTouchStart(e) { touchStartX = e.touches[0].clientX; }
function fcTouchEnd(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50) { fcNav(dx < 0 ? 1 : -1); }
}

// QUIZ
function renderQuizStart() {
  document.getElementById('quiz-inner').innerHTML = `
    <div class="quiz-wrap" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-top:40px;">
      <div style="font-size:48px">📝</div>
      <div style="font-size:18px;font-weight:900;color:var(--primary)">퀴즈 모드</div>
      <div style="font-size:13px;color:var(--text-muted);font-weight:600;text-align:center">현재 필터 기준으로 10문제를<br>4지선다로 풀어봐요!</div>
      <button class="quiz-start-btn" onclick="startQuiz()">퀴즈 시작하기 🚀</button>
    </div>`;
}

function startQuiz() {
  const pool = getFiltered();
  if(pool.length < 4) {
    document.getElementById('quiz-inner').innerHTML = '<div class="empty-msg" style="margin-top:40px">단어가 4개 이상 필요합니다</div>';
    return;
  }
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  const questions = shuffled.slice(0, Math.min(10, shuffled.length));
  quizState = { questions, current: 0, score: 0, answered: false };
  renderQuizQ();
}

function renderQuizQ() {
  const { questions, current } = quizState;
  const q = questions[current];
  const pool = getFiltered();
  const others = pool.filter(w=>w.word!==q.word).sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [q, ...others].sort(()=>Math.random()-0.5);
  quizState.opts = opts;
  quizState.answered = false;
  document.getElementById('quiz-inner').innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-q">
        <div class="quiz-num">${current+1} / ${questions.length}</div>
        <div class="quiz-word">${q.word}</div>
        <div class="quiz-phonetic">${q.phonetic}</div>
      </div>
      <div class="quiz-options">
        ${opts.map((o,i)=>`<button class="quiz-opt" id="qopt${i}" onclick="answerQuiz(${i})">${o.meaning}</button>`).join('')}
      </div>
    </div>`;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(q.word);
  u.lang='en-US'; u.rate=0.85; speechSynthesis.speak(u);
}

function answerQuiz(i) {
  if(quizState.answered) return;
  quizState.answered = true;
  const { questions, current, opts } = quizState;
  const q = questions[current];
  const correct = opts[i].word === q.word;
  if(correct) quizState.score++;
  opts.forEach((o,j)=>{
    const btn = document.getElementById('qopt'+j);
    if(o.word===q.word) btn.classList.add('reveal');
    else if(j===i && !correct) btn.classList.add('wrong');
    btn.disabled = true;
  });
  setTimeout(()=>{
    quizState.current++;
    if(quizState.current >= quizState.questions.length) showQuizResult();
    else renderQuizQ();
  }, 900);
}

function showQuizResult() {
  const { score, questions } = quizState;
  const pct = Math.round(score/questions.length*100);
  const emoji = pct===100?'🏆':pct>=80?'🎉':pct>=60?'😊':pct>=40?'🤔':'💪';
  const msg = pct===100?'완벽해요!':pct>=80?'훌륭해요!':pct>=60?'잘했어요!':pct>=40?'조금 더 연습해봐요':'다시 도전해봐요!';
  document.getElementById('quiz-inner').innerHTML = `
    <div class="quiz-wrap" style="align-items:center;justify-content:center;padding-top:40px;">
      <div class="quiz-result">
        <div class="quiz-result-emoji">${emoji}</div>
        <div class="quiz-result-score">${score} / ${questions.length}</div>
        <div class="quiz-result-label">${msg} (${pct}점)</div>
        <button class="quiz-retry-btn" onclick="startQuiz()">다시 풀기 🔄</button>
        <button class="quiz-retry-btn" style="margin-top:8px;background:white;color:var(--primary);border:2px solid var(--primary)" onclick="renderQuizStart()">처음으로</button>
      </div>
    </div>`;
}

init();
</script>
