      flex-direction: column;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);

    header {

      color: #FFFFFF;

      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
    }

    .range-container {
      background: #F9FAFB;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .range-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .range-bar::-webkit-scrollbar { display: none; }
    .range-chip {
      flex: 0 0 auto;
      padding: 6px 12px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
    }
    .range-chip.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .search-wrapper { position: relative; }
    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    .filters { display: flex; gap: 6px; }
    .filter-btn {
      flex: 1;
      padding: 8px 0;
      border: 1px solid var(--border);
      background: #FFFFFF;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-light);
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 700;
    }

    .main-content { flex: 1; padding: 0 16px 24px 16px; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    .word-list { display: flex; flex-direction: column; gap: 10px; }
    .word-item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: box-shadow 0.2s;
    }
    .word-item.memorized { opacity: 0.6; background: #F9FAFB; }
    .word-info { flex: 1; }
    .word-top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
    .word-eng { font-size: 17px; font-weight: 700; color: #111827; }
    .word-pos { font-size: 11px; color: var(--text-light); font-style: italic; background: #E5E7EB; padding: 1px 4px; border-radius: 3px; }
    .word-pho { font-size: 13px; color: var(--text-light); }
    .word-mean { font-size: 15px; font-weight: 500; color: #374151; margin-top: 2px; }
    .word-actions { display: flex; gap: 12px; align-items: center; }
    .btn-icon { background: none; border: none; font-size: 20px; cursor: pointer; color: #D1D5DB; }
    .btn-icon.fav.active { color: var(--star); }
    .btn-icon.status.active { color: var(--primary); }
    .btn-tts { color: #9CA3AF; font-size: 18px; }

    .flashcard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
      gap: 20px;
    }
    .flashcard {
      width: 100%;
      height: 240px;
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      padding: 20px;
      text-align: center;

    .card-eng { font-size: 28px; font-weight: 800; color: #111827; margin-bottom: 8px; }

    .card-mean { font-size: 20px; font-weight: 700; color: var(--primary); display: none; }
    .card-mean.show { display: block; }
    .card-hint { font-size: 12px; color: #9CA3AF; position: absolute; bottom: 15px; }
    .card-speaker { position: absolute; top: 15px; right: 15px; font-size: 22px; color: #9CA3AF; background: none; border: none; cursor: pointer; }
    .card-controls { display: flex; width: 100%; gap: 10px; }
    .card-btn { flex: 1; padding: 12px 0; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .card-btn.wrong { background: #FEE2E2; color: #EF4444; }
    .card-btn.right { background: #D1FAE5; color: #10B981; }
    .card-progress { font-size: 13px; color: var(--text-light); font-weight: 600; }

    .quiz-progress { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-light); font-weight: 600; }
    .quiz-qbox {

      padding: 24px;

      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;

    .quiz-score { font-size: 48px; font-weight: 800; color: var(--primary); margin: 16px 0; }

    {word:"bring",phonetic:"[brɪŋ]",meaning:"가져오다",pos:"v"},

    {word:"consciousness",phonetic:"[ˈkɒnʃəsnəs]",meaning:"의식",pos:"n"},
    {word:"list",phonetic:"[lɪst]",meaning:"나열하다",pos:"v"},
    {word:"retrieve",phonetic:"[rɪˈtriːv]",meaning:"인출하다, 회수하다",pos:"v"},
    {word:"reel",phonetic:"[riːl]",meaning:"줄줄이 말하다",pos:"v"},
    {word:"awareness",phonetic:"[əˈweərnəs]",meaning:"의식, 자각",pos:"n"},
    {word:"item",phonetic:"[ˈaɪtəm]",meaning:"항목, 물품",pos:"n"},
    {word:"chunk",phonetic:"[tʃʌŋk]",meaning:"덩어리",pos:"n"},
    {word:"hold",phonetic:"[həʊld]",meaning:"유지하다, 보유하다",pos:"v"},
    {word:"explicit",phonetic:"[ɪkˈsplɪsɪt]",meaning:"명시적인",a:"a"},
    {word:"visualize",phonetic:"[ˈvɪʒuəlaɪz]",meaning:"시각화하다",pos:"v"},

    {word:"example",phonetic:"[ɪgˈzɑːmpl]",meaning:"예",pos:"n"},
    {word:"actor",phonetic:"[ˈæktər]",meaning:"배우",pos:"n"},
    {word:"large",phonetic:"[lɑːrdʒ]",meaning:"큰",a:"a"},
    {word:"group",phonetic:"[gruːp]",meaning:"집단, 그룹",pos:"n"},
    {word:"still",phonetic:"[stɪl]",meaning:"여전히",pos:"ad"},
    {word:"gesture",phonetic:"[ˈsub-title]",meaning:"제스처하다, 몸짓하다",pos:"v"},
    {word:"speech",phonetic:"[spiːtʃ]",meaning:"말, 연설",pos:"n"},
    {word:"perform",phonetic:"[pərˈfɔːrm]",meaning:"수행하다, 하다",pos:"v"},
    {word:"odd",phonetic:"[ɒd]",meaning:"이상한, 특이한",a:"a"},
    {word:"slide",phonetic:"[slaɪd]",meaning:"미끄러지다",pos:"v"},
    {word:"jogger",phonetic:"[ˈdʒɒgər]",meaning:"조깅하는 사람",pos:"n"},
    {word:"bend",phonetic:"[bend]",meaning:"구부리다",pos:"v"},
    {word:"fence",phonetic:"[fens]",meaning:"울타리",pos:"n"},
    {word:"swing",phonetic:"[swɪŋ]",meaning:"흔들리다, 휘두르다",pos:"v"},
    {word:"spontaneously",phonetic:"[spɒnˈteɪniəsli]",meaning:"자발적으로, 즉흥적으로",pos:"ad"},
    {word:"encode",phonetic:"[ɪnˈgəʊd]",meaning:"부호화하다, 암호화하다",pos:"v"},
    {word:"memorable",phonetic:"[ˈmemərəbl]",meaning:"기억할 만한, 인상적인",a:"a"},
    {word:"description",phonetic:"[dɪˈskrɪpʃn]",meaning:"묘사, 설명",pos:"n"},
    {word:"approximately",phonetic:"[əˈprɒksɪmətli]",meaning:"대략, 약",pos:"ad"},
    {word:"greenhouse",phonetic:"[ˈgrɪːnhaʊs]",meaning:"온실",pos:"n"},
    {word:"emission",phonetic:"[sub-title]",meaning:"배출",pos:"n"},
    {word:"degradation",phonetic:"[ˌdegrəˈdeɪʃn]",meaning:"황폐화, 악화",pos:"n"},
    {word:"deforestation",phonetic:"[...]",meaning:"삼림 벌채",pos:"n"},
    {word:"carbon",phonetic:"[ˈkɑːbən]",meaning:"탄소",pos:"n"},
    {word:"cycle",phonetic:"[ˈsaɪkl]",meaning:"순환, 주기",pos:"n"},
    {word:"convert",phonetic:"[kənˈvɜːrt]",meaning:"변환하다, 전환하다",pos:"v"},
    {word:"oxygen",phonetic:"[ˈɒksɪdʒən]",meaning:"산소",pos:"n"},
    {word:"photosynthesis",phonetic:"[...]",meaning:"광합성",pos:"n"},
    {word:"consequently",phonetic:"[ˈkɒnsɪkwəntli]",meaning:"결과적으로",pos:"ad"},
    {word:"view",phonetic:"[vjuː]",meaning:"여기다, 보다",pos:"v"},
    {word:"regulator",phonetic:"[ˈregjuleɪtər]",meaning:"조절자, 규제자",pos:"n"},
    {word:"existence",phonetic:"[ɪgˈzɪstəns]",meaning:"존재",pos:"n"},
    {word:"doubt",phonetic:"[daʊt]",meaning:"의심",pos:"n"},
    {word:"reduce",phonetic:"[rɪˈdjuːs]",meaning:"줄이다, 감소시키다",pos:"v"},
    {word:"presence",phonetic:"[ˈprezns]",meaning:"존재, 있음",pos:"n"},
    {word:"atmosphere",phonetic:"[ˈætməsfɪər]",meaning:"대기, 분위기",pos:"n"},
    {word:"prevent",phonetic:"[prɪˈvent]",meaning:"막다, 예방하다",pos:"v"},
    {word:"accomplish",phonetic:"[əˈkʌmplɪʃ]",meaning:"달성하다, 성취하다",pos:"v"},
    {word:"progressively",phonetic:"[prəˈgresɪvli]",meaning:"점진적으로",pos:"ad"},
    {word:"radiation",phonetic:"[ˌreɪdiˈeɪʃn]",meaning:"복사열, 방사선",pos:"n"},
    {word:"cause",phonetic:"[kɔːz]",meaning:"야기하다, 일으키다",pos:"v"},
    {word:"average",phonetic:"[ˈævərɪdʒ]",meaning:"평균의",a:"a"},
    {word:"accordingly",phonetic:"[...]",meaning:"따라서, 그에 맞춰",pos:"ad"},
    {word:"major",phonetic:"[ˈmeɪdʒər]",meaning:"주요한, 중대한",a:"a"},
    {word:"global",phonetic:"[ˈgləʊbl]",meaning:"전 지구적인, 세계적인",a:"a"},
    {word:"unconscious",phonetic:"[ʌnˈkɒnʃəs]",meaning:"무의식적인",a:"a"},
    {word:"detector",phonetic:"[dɪˈtektər]",meaning:"탐지기",pos:"n"},
    {word:"determine",phonetic:"[dɪˈtɜːmɪn]",meaning:"결정하다",pos:"v"},
    {word:"determination",phonetic:"[dɪˌtɜːmɪˈneɪʃn]",meaning:"판단, 결정",pos:"n"},
    {word:"assess",phonetic:"[əˈses]",meaning:"평가하다",pos:"v"},
    {word:"dangerous",phonetic:"[ˈdeɪndʒərəs]",meaning:"위험한",a:"a"},
    {word:"flight",phonetic:"[flaɪt]",meaning:"도피",pos:"n"},
    {word:"correct",phonetic:"[kəˈrekt]",meaning:"바로잡다",pos:"v"},
    {word:"mistake",phonetic:"[mɪˈsteɪk]",meaning:"실수",pos:"n"},
    {word:"convince",phonetic:"[kənˈvɪns]",meaning:"확신시키다",pos:"v"},
    {word:"rational",phonetic:"[ˈræʃnəl]",meaning:"이성적인",a:"a"},
    {word:"emotionally",phonetic:"[ɪˈməl]",meaning:"감정적으로",pos:"ad"},
    {word:"internally",phonetic:"[ɪnˈtɜːnəli]",meaning:"내적으로",pos:"ad"}
  ];

  // AI 환각 발음기호 정제
  const cleanPhonetic = (p) => {
    if(!p) return '[...]';
    let s = p.replace(/Im|Pall|Nen|Bridge-|sub-title|txt|txt/g, '');
    return s.trim() === '[]' || s.trim() === '' ? '[...]' : s;
  };

  // 로컬스토리지 연동 객체 배열 생성
  let localFavs = JSON.parse(localStorage.getItem('cu_favs') || '{}');
  let localWrongs = JSON.parse(localStorage.getItem('cu_wrongs') || '{}');

  let words = rawData.map((w, idx) => ({
    id: idx + 1,
    word: w.word,
    phonetic: cleanPhonetic(w.phonetic),
    meaning: w.meaning,
    pos: w.pos || 'n',
    fav: !!localFavs[idx + 1],
    wrong: !!localWrongs[idx + 1]
  }));

  let currentTab = 'list';
  let currentRange = 'all'; 
  let currentFilter = 'all'; 
  
  // 플래시카드/퀴즈 내부 상태
  let flashIdx = 0;
  let flashList = [];
  let quizIdx = 0;
  let quizList = [];
  let quizScore = 0;

  // 터치 스와이프 변수
  let touchStartX = 0;
  let touchEndX = 0;

  function saveStorage() {
    let favs = {};
    let wrongs = {};
    words.forEach(w => {
      if(w.fav) favs[w.id] = true;
      if(w.wrong) wrongs[w.id] = true;
    });
    localStorage.setItem('cu_favs', JSON.stringify(favs));
    localStorage.setItem('cu_wrongs', JSON.stringify(wrongs));
  }

  function getFilteredWords() {
    let result = words;
    // 1. 구간 필터링
    if (currentRange !== 'all') {
      let [start, end] = currentRange.split('-').map(Number);
      result = result.filter(w => w.id >= start && w.id <= end);
    }
    // 2. 상태 필터링 (리스트 전용 및 공통 상태 연동용)
    if (currentFilter === 'wrong') {
      result = result.filter(w => w.wrong);
    } else if (currentFilter === 'fav') {
      result = result.filter(w => w.fav);
    }
    return result;
  }

  function initRangeBar() {
    const bar = document.getElementById('range-bar-ui');
    let html = `<button class="range-chip ${currentRange === 'all'?'active':''}" onclick="setRange('all')">전체</button>`;
    
    let step = 10;
    for(let i = 1; i <= words.length; i += step) {
      let end = Math.min(i + step - 1, words.length);
      let rStr = `${i}-${end}`;
      html += `<button class="range-chip ${currentRange === rStr?'active':''}" onclick="setRange('${rStr}')">${rStr}</button>`;
    }
    bar.innerHTML = html;
  }

  function setRange(r) {
    currentRange = r;
    initRangeBar();
    syncViews();
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if(f === 'all') document.getElementById('f-all').classList.add('active');
    if(f === 'wrong') document.getElementById('f-wrong').classList.add('active');
    if(f === 'fav') document.getElementById('f-fav').classList.add('active');
    syncViews();
  }

  function switchTab(t) {
    currentTab = t;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.getElementById(`view-${t}`).classList.add('active');
    
    syncViews();
  }

  function syncViews() {
    if(currentTab === 'list') renderList();
    if(currentTab === 'flash') initFlashcards();
    if(currentTab === 'quiz') initQuiz();
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }
  }

  // 단어목록 로직
  function toggleFav(id) {
    let w = words.find(x => x.id === id);
    if(w) { w.fav = !w.fav; saveStorage(); syncViews(); }
  }
  function toggleWrong(id) {
    let w = words.find(x => x.id === id);
    if(w) { w.wrong = !w.wrong; saveStorage(); syncViews(); }
  }

  function renderList() {
    const container = document.getElementById('word-list-ui');
    let list = getFilteredWords();
    let q = document.getElementById('search-input').value.trim().toLowerCase();
    
    if(q) {
      list = list.filter(w => w.word.toLowerCase().includes(q) || w.meaning.includes(q));
    }

    if(list.length === 0) {
      container.innerHTML = `<div class="empty-state">해당 범위나 조건에 맞는 단어가 없습니다.</div>`;
      return;
    }

    container.innerHTML = list.map(w => `
      <div class="word-item ${w.wrong ? '' : 'memorized'}">
        <div class="word-info">
          <div class="word-top">
            <span class="word-eng">${w.word}</span>
            <span class="word-pos">${w.pos}</span>
            <span class="word-pho">${w.phonetic}</span>
          </div>
          <div class="word-mean">${w.meaning}</div>
        </div>
        <div class="word-actions">
          <button class="btn-icon btn-tts" onclick="speak('${w.word.replace(/'/g, "\\'")}')">🔊</button>
          <button class="btn-icon fav ${w.fav?'active':''}" onclick="toggleFav(${w.id})">★</button>
          <button class="btn-icon status ${w.wrong?'active':''}" onclick="toggleWrong(${w.id})">✔</button>
        </div>
      </div>
    `).join('');
  }

  // 플래시카드 로직
  function initFlashcards() {
    flashList = getFilteredWords();
    flashIdx = 0;
    renderCard();
  }

  function renderCard() {
    const container = document.getElementById('flash-ui');
    if(flashList.length === 0) {
      container.innerHTML = `<div class="empty-state">선택된 구간에 단어가 없습니다.</div>`;
      return;
    }
    let w = flashList[flashIdx];
    container.innerHTML = `
      <div class="flashcard" onclick="revealCardMean()" id="fcard-box">
        <button class="card-speaker" onclick="handleCardSpeech(event, '${w.word.replace(/'/g, "\\'")}')">🔊</button>
        <div class="card-eng">${w.word}</div>
        <div class="card-pho">${w.phonetic}</div>
        <div class="card-mean" id="card-mean-text">${w.meaning}</div>
        <div class="card-hint" id="card-hint-text">터치하여 뜻 보기 (또는 좌우 스와이프)</div>
      </div>
      <div class="card-progress">${flashIdx + 1} / ${flashList.length}</div>
      <div class="card-controls">
        <button class="card-btn wrong" onclick="setCardStatus(true)">아직 모름 ❌</button>
        <button class="card-btn right" onclick="setCardStatus(false)">알아요  ✔</button>
      </div>
    `;

    // 스와이프 이벤트 설정
    let box = document.getElementById('fcard-box');
    box.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    box.addEventListener('touchend', e => { 
      touchEndX = e.changedTouches[0].screenX;
      handleCardSwipe();
    }, false);
  }

  function revealCardMean() {
    let m = document.getElementById('card-mean-text');
    let h = document.getElementById('card-hint-text');
    if(m && !m.classList.contains('show')) {
      m.classList.add('show');
      h.style.display = 'none';
      speak(flashList[flashIdx].word);
    }
  }

  function handleCardSpeech(e, txt) {
    e.stopPropagation();
    speak(txt);
  }

  function handleCardSwipe() {
    if (touchStartX - touchEndX > 50) { // 왼쪽 스와이프 -> 다음 단어
      if(flashIdx < flashList.length - 1) { flashIdx++; renderCard(); }
    }
    if (touchEndX - touchStartX > 50) { // 오른쪽 스와이프 -> 이전 단어
      if(flashIdx > 0) { flashIdx--; renderCard(); }
    }
  }

  function setCardStatus(isWrong) {
    let w = words.find(x => x.id === flashList[flashIdx].id);
    if(w) {
      w.wrong = isWrong;
      saveStorage();
    }
    if(flashIdx < flashList.length - 1) {
      flashIdx++;
      renderCard();
    } else {
      alert("마지막 카드입니다!");
    }
  }

  // 퀴즈 로직
  function initQuiz() {
    let base = getFilteredWords();
    if(base.length < 4) {
      document.getElementById('quiz-ui').innerHTML = `<div class="empty-state">퀴즈를 출제하려면 최소 4개 이상의 단어가 구간 내에 있어야 합니다.</div>`;
      return;
    }
    // 10문제 무작위 추출
    quizList = [...base].sort(() => 0.5 - Math.random()).slice(0, 10);
    quizIdx = 0;
    quizScore = 0;
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    const container = document.getElementById('quiz-ui');
    let q = quizList[quizIdx];
    
    // 오답 보기를 원본 데이터 풀에서 가져오기
    let wrongPool = words.filter(x => x.meaning !== q.meaning);
    let wrongs = [];
    while(wrongs.length < 3) {
      let r = wrongPool[Math.floor(Math.random() * wrongPool.length)];
      if(!wrongs.some(x => x.meaning === r.meaning)) wrongs.push(r);
    }

    let opts = [{text: q.meaning, correct: true}, ...wrongs.map(w => ({text: w.meaning, correct: false}))];
    opts.sort(() => 0.5 - Math.random());

    container.innerHTML = `
      <div class="quiz-container">
        <div class="quiz-progress">
          <span>문제 ${quizIdx + 1} / ${quizList.length}</span>
          <span>점수: ${quizScore * 10}점</span>
        </div>
        <div class="quiz-qbox">
          <div class="quiz-word">${q.word}</div>
        </div>
        <div class="quiz-options">
          ${opts.map((o, i) => `<button class="quiz-opt" onclick="handleQuizAnswer(this, ${o.correct})">${i+1}. ${o.text}</button>`).join('')}
        </div>
      </div>
    `;
    speak(q.word);
  }

  function handleQuizAnswer(btn, isCorrect) {
    // 중복 클릭 방지
    let opts = document.querySelectorAll('.quiz-opt');
    opts.forEach(b => b.disabled = true);

    if(isCorrect) {
      btn.classList.add('correct');
      quizScore++;
    } else {
      btn.classList.add('wrong');
      opts.forEach(b => {
        // 정답 시각적 피드백 제공
        if(b.innerText.includes(quizList[quizIdx].meaning)) b.classList.add('correct');
      });
      // 틀린 단어는 오답 기록 자동 추가
      let w = words.find(x => x.id === quizList[quizIdx].id);
      if(w) { w.wrong = true; saveStorage(); }
    }

    setTimeout(() => {
      quizIdx++;
      if(quizIdx < quizList.length) {
        renderQuizQuestion();
      } else {
        renderQuizResult();
      }
    }, 1200);
  }

  function renderQuizResult() {
    const container = document.getElementById('quiz-ui');
    let emoji = "🔥";
    let msg = "완벽해요! 대단한 실력입니다.";
    let totalScore = quizScore * 10;
    if(totalScore < 80) { emoji = "🌱"; msg = "조금 더 연습해볼까요? 화이팅!"; }
    if(totalScore < 50) { emoji = "📖"; msg = "틀린 단어 위주로 목록을 다시 읽어보세요!"; }

    container.innerHTML = `
      <div class="quiz-result-view">
        <div>${emoji}</div>
        <div class="quiz-score">${totalScore}점</div>
        <div class="quiz-feedback">${msg}</div>
        <button class="btn-restart" onclick="initQuiz()">다시 도전하기</button>
      </div>
    `;
  }

  // 초기 로드
  initRangeBar();
  renderList();
</script>

</body>
