<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>씨유에탑 · 수능특강 11강 어휘</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563EB;
    --primary-light: #EFF6FF;
    --primary-dark: #1D4ED8;
    --secondary: #64748B;
    --success: #10B981;
    --danger: #EF4444;
    --warning: #F59E0B;
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --border: #E2E8F0;
    --text: #1E293B;
    --text-sub: #64748B;
    --text-muted: #94A3B8;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(37,99,235,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); max-width: 420px; margin: 0 auto; min-height: 100vh; }

  /* HEADER */
  .header { background: var(--primary); color: #fff; padding: 18px 16px 14px; position: sticky; top: 0; z-index: 100; }
  .header-brand { font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.8; margin-bottom: 3px; }
  .header-title { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .header-sub { font-size: 12px; opacity: 0.75; margin-top: 3px; }
  .header-search { margin-top: 10px; position: relative; }
  .header-search input { width: 100%; padding: 8px 14px 8px 34px; border-radius: 8px; border: none; background: rgba(255,255,255,0.18); color: #fff; font-size: 13px; font-family: 'Nunito', sans-serif; outline: none; }
  .header-search input::placeholder { color: rgba(255,255,255,0.6); }
  .header-search .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.7; }

  /* TABS */
  .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 114px; z-index: 99; }
  .tab-btn { flex: 1; padding: 11px 4px; font-size: 12px; font-weight: 600; color: var(--text-sub); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; font-family: 'Noto Sans KR', sans-serif; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* SEGMENT BAR */
  .segment-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 8px 12px; overflow-x: auto; white-space: nowrap; position: sticky; top: 157px; z-index: 98; scrollbar-width: none; }
  .segment-bar::-webkit-scrollbar { display: none; }
  .seg-btn { display: inline-block; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text-sub); background: none; margin-right: 6px; cursor: pointer; font-family: 'Nunito', sans-serif; white-space: nowrap; transition: all .15s; }
  .seg-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* FILTER BAR */
  .filter-bar { display: flex; gap: 6px; padding: 10px 12px 6px; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text-sub); background: var(--card); cursor: pointer; font-family: 'Nunito', sans-serif; transition: all .15s; }
  .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* STATS BAR */
  .stats-bar { padding: 6px 12px 10px; display: flex; align-items: center; gap: 8px; }
  .progress-wrap { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
  .stats-text { font-size: 11px; color: var(--text-muted); font-family: 'Nunito', sans-serif; white-space: nowrap; }

  /* WORD LIST */
  .word-list { padding: 0 12px 80px; }
  .word-card { background: var(--card); border-radius: var(--radius); margin-bottom: 8px; box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid var(--border); transition: border-color .15s; }
  .word-card.known { border-left: 4px solid var(--success); }
  .word-card.unknown { border-left: 4px solid var(--danger); }
  .word-card.skipped { border-left: 4px solid var(--warning); }
  .wc-header { display: flex; align-items: center; padding: 11px 12px 9px; gap: 8px; }
  .wc-num { font-size: 10px; color: var(--text-muted); font-family: 'Nunito', sans-serif; font-weight: 700; min-width: 22px; }
  .wc-word { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
  .wc-pos { font-size: 10px; color: var(--primary); background: var(--primary-light); padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .wc-fav { background: none; border: none; font-size: 16px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .wc-body { padding: 0 12px 10px; }
  .wc-phonetic { font-size: 12px; color: var(--text-muted); font-family: 'Nunito', sans-serif; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .wc-speak { background: none; border: none; font-size: 13px; cursor: pointer; padding: 0; }
  .wc-meaning { font-size: 13px; color: var(--text); font-weight: 500; }
  .wc-actions { display: flex; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--border); background: #FAFBFC; }
  .wc-act-btn { flex: 1; padding: 6px 4px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 11px; font-weight: 600; cursor: pointer; background: var(--card); font-family: 'Noto Sans KR', sans-serif; transition: all .15s; }
  .wc-act-btn.known { background: #ECFDF5; border-color: var(--success); color: var(--success); }
  .wc-act-btn.unknown { background: #FEF2F2; border-color: var(--danger); color: var(--danger); }
  .wc-act-btn.skipped { background: #FFFBEB; border-color: var(--warning); color: #92400E; }

  /* FLASH CARD */
  .flash-section { padding: 12px 12px 80px; }
  .flash-counter { text-align: center; font-size: 12px; color: var(--text-muted); font-family: 'Nunito', sans-serif; font-weight: 600; margin-bottom: 10px; }
  .flash-card { background: var(--card); border-radius: 18px; box-shadow: 0 4px 24px rgba(37,99,235,0.12); border: 1.5px solid var(--border); min-height: 180px; display: flex; flex-direction: column; cursor: pointer; user-select: none; }
  .flash-card-front { padding: 28px 24px 20px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .flash-word { font-family: 'Nunito', sans-serif; font-size: 26px; font-weight: 800; color: var(--text); text-align: center; }
  .flash-phonetic { font-size: 13px; color: var(--text-muted); text-align: center; font-family: 'Nunito', sans-serif; display: flex; align-items: center; gap: 8px; }
  .flash-pos { font-size: 11px; color: var(--primary); background: var(--primary-light); padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .flash-tap-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .flash-meaning-box { padding: 14px 20px 16px; border-top: 1px solid var(--border); background: #F0F7FF; border-radius: 0 0 18px 18px; display: none; }
  .flash-meaning-box.show { display: block; }
  .flash-meaning-text { font-size: 16px; font-weight: 600; color: var(--primary-dark); text-align: center; }
  .flash-nav { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .flash-nav-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--card); font-size: 18px; cursor: pointer; text-align: center; transition: background .15s; }
  .flash-nav-btn:active { background: var(--primary-light); }
  .flash-act-row { display: flex; gap: 8px; margin-top: 10px; }
  .flash-act-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 600; cursor: pointer; background: var(--card); font-family: 'Noto Sans KR', sans-serif; transition: all .15s; }
  .flash-act-btn.known { background: #ECFDF5; border-color: var(--success); color: var(--success); }
  .flash-act-btn.unknown { background: #FEF2F2; border-color: var(--danger); color: var(--danger); }
  .flash-act-btn.skip { background: #FFFBEB; border-color: var(--warning); color: #92400E; }

  /* QUIZ */
  .quiz-section { padding: 12px 12px 80px; }
  .quiz-header { text-align: center; margin-bottom: 16px; }
  .quiz-score-badge { display: inline-block; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 14px; border-radius: 20px; margin-bottom: 10px; }
  .quiz-progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
  .quiz-progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width .3s; }
  .quiz-question { background: var(--card); border-radius: var(--radius); padding: 22px 18px; box-shadow: var(--shadow); border: 1.5px solid var(--border); margin-bottom: 14px; text-align: center; }
  .quiz-q-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-family: 'Nunito', sans-serif; }
  .quiz-q-word { font-family: 'Nunito', sans-serif; font-size: 24px; font-weight: 800; color: var(--text); }
  .quiz-q-phonetic { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-family: 'Nunito', sans-serif; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt { padding: 13px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; font-family: 'Noto Sans KR', sans-serif; transition: all .15s; }
  .quiz-opt:active { background: var(--primary-light); }
  .quiz-opt.correct { background: #ECFDF5; border-color: var(--success); color: #065F46; }
  .quiz-opt.wrong { background: #FEF2F2; border-color: var(--danger); color: #991B1B; }
  .quiz-result { text-align: center; padding: 30px 20px; }
  .quiz-emoji { font-size: 56px; margin-bottom: 12px; }
  .quiz-result-score { font-family: 'Nunito', sans-serif; font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
  .quiz-result-msg { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; }
  .quiz-restart-btn { display: inline-block; padding: 12px 28px; background: var(--primary); color: #fff; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .quiz-start { text-align: center; padding: 40px 20px; }
  .quiz-start-btn { display: inline-block; padding: 14px 36px; background: var(--primary); color: #fff; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }

  /* EMPTY */
  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-text { font-size: 13px; }

  /* SWIPE TOUCH */
  .touch-area { touch-action: pan-y; }
</style>
</head>
<body>

  <button class="tab-btn" onclick="switchTab('quiz')">퀴즈</button>
</div>

<div class="segment-bar" id="segmentBar"></div>

<div id="app"></div>

  {word:"vague",phonetic:"veɪɡ",meaning:"뚜렷한, 별개의 (모호한)",pos:"형용사"},
  {word:"racialization",phonetic:"ˌreɪʃəlaɪˈzeɪʃn",meaning:"인종화",pos:"명사"},
  {word:"retailer",phonetic:"ˈriːteɪlər",meaning:"소매업자",pos:"명사"},
  {word:"account",phonetic:"əˈkaʊnt",meaning:"설명, 기술",pos:"명사"},
  {word:"explanation",phonetic:"ˌekspləˈneɪʃn",meaning:"설명, 기술",pos:"명사"},
  {word:"transport",phonetic:"trænsˈpɔːrt",meaning:"수송하다, 운송하다",pos:"동사"},
  {word:"convey",phonetic:"kənˈveɪ",meaning:"수송하다, 운송하다",pos:"동사"},
  {word:"in terms of",phonetic:"ɪn tɜːrmz əv",meaning:"-라는 측면에서, ~에 관하여",pos:"전치사구"},
  {word:"involve",phonetic:"ɪnˈvɑːlv",meaning:"수반하다, 포함하다",pos:"동사"},
  {word:"entail",phonetic:"ɪnˈteɪl",meaning:"수반하다, 포함하다",pos:"동사"},
  {word:"civilized",phonetic:"ˈsɪvəlaɪzd",meaning:"문명화된",pos:"형용사"},
  {word:"savage",phonetic:"ˈsævɪdʒ",meaning:"문명화된 (야만적인)",pos:"형용사"},
  {word:"barbaric",phonetic:"bɑːrˈbærɪk",meaning:"문명화된 (미개한)",pos:"형용사"},
  {word:"genetically",phonetic:"dʒəˈnetɪkli",meaning:"유전적으로",pos:"부사"},
  {word:"highlight",phonetic:"ˈhaɪlaɪt",meaning:"강조하다",pos:"동사"},
  {word:"underscore",phonetic:"ˌʌndərˈskɔːr",meaning:"강조하다",pos:"동사"},
  {word:"downplay",phonetic:"ˈdaʊnpleɪ",meaning:"강조하다 (경시하다)",pos:"동사"},
  {word:"contribute to",phonetic:"kənˈtrɪbjuːt tuː",meaning:"~의 원인이 되다, 기여하다",pos:"동사구"},
  {word:"observation",phonetic:"ˌɑːbzərˈveɪʃn",meaning:"관찰, 소견",pos:"명사"},
  {word:"remark",phonetic:"rɪˈmɑːrk",meaning:"관찰, 소견",pos:"명사"},
  {word:"overlook",phonetic:"ˌoʊvərˈlʊk",meaning:"간과하다",pos:"동사"},
  {word:"neglect",phonetic:"nɪˈɡlekt",meaning:"간과하다",pos:"동사"},
  {word:"miss",phonetic:"mɪs",meaning:"간과하다",pos:"동사"},
  {word:"incidence",phonetic:"ˈɪnsɪdəns",meaning:"발생률, 빈도",pos:"명사"},
  {word:"obesity",phonetic:"oʊˈbiːsəti",meaning:"비만",pos:"명사"},
  {word:"in parallel",phonetic:"ɪn ˈpærəlel",meaning:"나란히, 동시에",pos:"부사구"},
  {word:"portion",phonetic:"ˈpɔːrʃn",meaning:"1인분, 부분",pos:"명사"},
  {word:"coincidence",phonetic:"koʊˈɪnsɪdəns",meaning:"우연의 일치",pos:"명사"},
  {word:"distortion",phonetic:"dɪˈstɔːrʃn",meaning:"왜곡",pos:"명사"},
  {word:"consistently",phonetic:"kənˈsɪstəntli",meaning:"일관되게, 지속적으로",pos:"부사"},
  {word:"constantly",phonetic:"ˈkɑːnstəntli",meaning:"일관되게, 지속적으로",pos:"부사"},
  {word:"inconsistently",phonetic:"ˌɪnkənˈsɪstəntli",meaning:"일관되게 (기초 없이)",pos:"부사"},
  {word:"unintentionally",phonetic:"ˌʌnɪnˈtenʃənəli",meaning:"의도치 않게, 무심코",pos:"부사"},
  {word:"accidentally",phonetic:"ˌæksɪˈdentəli",meaning:"의도치 않게, 무심코",pos:"부사"},
  {word:"deliberately",phonetic:"dɪˈlɪbərətli",meaning:"의도치 않게 (의도적으로)",pos:"부사"},
  {word:"ultimately",phonetic:"ˈʌltɪmətli",meaning:"궁극적으로, 결국",pos:"부사"},
  {word:"eventually",phonetic:"ɪˈventʃuəli",meaning:"궁극적으로, 결국",pos:"부사"}
];

// State
let words = RAW.map((w, i) => ({...w, id: i, fav: false, status: ''}));
let currentTab = 'list';
let currentFilter = 'all';
let currentSeg = 0; // 0 = all
let searchQuery = '';
let flashIdx = 0;
let flashShowMeaning = false;
let flashTouchStartX = 0;
let quizState = null;

// Load from localStorage
function loadStorage() {
  try {
    const saved = JSON.parse(localStorage.getItem('cutop_suteuk11') || '{}');
    words.forEach(w => {
      if (saved[w.word]) {
        w.fav = saved[w.word].fav || false;
        w.status = saved[w.word].status || '';
      }
    });
  } catch(e) {}
}

function saveStorage() {
  try {
    const data = {};
    words.forEach(w => { data[w.word] = {fav: w.fav, status: w.status}; });
    localStorage.setItem('cutop_suteuk11', JSON.stringify(data));
  } catch(e) {}
}

loadStorage();

// Segments
const SEGS = [];
for (let i = 0; i < words.length; i += 10) {
  SEGS.push({start: i, end: Math.min(i+9, words.length-1), label: `${i+1}-${Math.min(i+10, words.length)}`});
}

function buildSegmentBar() {
  const bar = document.getElementById('segmentBar');
  let html = `<button class="seg-btn ${currentSeg===0?'active':''}" onclick="selectSeg(0)">전체</button>`;
  SEGS.forEach((s, i) => {
    html += `<button class="seg-btn ${currentSeg===i+1?'active':''}" onclick="selectSeg(${i+1})">${s.label}</button>`;
  });
  bar.innerHTML = html;
}

function selectSeg(n) {
  currentSeg = n;
  flashIdx = 0;
  flashShowMeaning = false;
  buildSegmentBar();
  render();
}

function getSegWords() {
  if (currentSeg === 0) return words;
  const s = SEGS[currentSeg-1];
  return words.slice(s.start, s.end+1);
}

function getFilteredWords() {
  let list = getSegWords();
  if (currentFilter === 'unknown') list = list.filter(w => w.status === 'unknown');
  else if (currentFilter === 'fav') list = list.filter(w => w.fav);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(w => w.word.toLowerCase().includes(q) || w.meaning.includes(q));
  }
  return list;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function setStatus(id, status) {
  const w = words.find(x => x.id === id);
  if (w) { w.status = w.status === status ? '' : status; saveStorage(); render(); }
}

function toggleFav(id) {
  const w = words.find(x => x.id === id);
  if (w) { w.fav = !w.fav; saveStorage(); render(); }
}

// Stats
function getStats() {
  const seg = getSegWords();
  const known = seg.filter(w => w.status === 'known').length;
  const unknown = seg.filter(w => w.status === 'unknown').length;
  const total = seg.length;
  return {known, unknown, total, pct: total ? Math.round(known/total*100) : 0};
}

// UPDATE header sub
function updateHeaderSub() {
  const stats = getStats();
  const segLabel = currentSeg === 0 ? `총 ${RAW.length}단어` : `${SEGS[currentSeg-1].label}번 · ${stats.total}단어`;
  document.getElementById('headerSub').textContent = `수능특강 11강 어휘 · ${segLabel}`;
}

// RENDER
function render() {
  updateHeaderSub();
  buildSegmentBar();
  const app = document.getElementById('app');
  if (currentTab === 'list') renderList(app);
  else if (currentTab === 'flash') renderFlash(app);
  else if (currentTab === 'quiz') renderQuiz(app);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['list','flash','quiz'][i] === tab);
  });
  flashIdx = 0; flashShowMeaning = false;
  render();
}

// LIST
function renderList(app) {
  const stats = getStats();
  const list = getFilteredWords();

  let html = `
  <div class="filter-bar">
    <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">전체 ${getSegWords().length}</button>
    <button class="filter-btn ${currentFilter==='unknown'?'active':''}" onclick="setFilter('unknown')">모르는 단어 ${getSegWords().filter(w=>w.status==='unknown').length}</button>
    <button class="filter-btn ${currentFilter==='fav'?'active':''}" onclick="setFilter('fav')">⭐ 즐겨찾기 ${getSegWords().filter(w=>w.fav).length}</button>
  </div>
  <div class="stats-bar">
    <div class="progress-wrap"><div class="progress-fill" style="width:${stats.pct}%"></div></div>
    <div class="stats-text">✅${stats.known} ❌${stats.unknown} / ${stats.total}</div>
  </div>
  <div class="word-list">`;

  if (list.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">해당하는 단어가 없습니다</div></div>`;
  } else {
    list.forEach((w, i) => {
      const globalIdx = words.indexOf(w) + 1;
      html += `
      <div class="word-card ${w.status}" id="wc_${w.id}">
        <div class="wc-header">
          <span class="wc-num">${globalIdx}</span>
          <span class="wc-word">${w.word}</span>
          <span class="wc-pos">${w.pos}</span>
          <button class="wc-fav" onclick="toggleFav(${w.id})">${w.fav?'⭐':'☆'}</button>
        </div>
        <div class="wc-body">
          <div class="wc-phonetic">
            <span>[${w.phonetic}]</span>
            <button class="wc-speak" onclick="speak('${w.word.replace(/'/g,"\\'")}')">🔊</button>
          </div>
          <div class="wc-meaning">${w.meaning}</div>
        </div>
        <div class="wc-actions">
          <button class="wc-act-btn ${w.status==='known'?'known':''}" onclick="setStatus(${w.id},'known')">✅ 알아요</button>
          <button class="wc-act-btn ${w.status==='unknown'?'unknown':''}" onclick="setStatus(${w.id},'unknown')">❌ 모름</button>
          <button class="wc-act-btn ${w.status==='skipped'?'skipped':''}" onclick="setStatus(${w.id},'skipped')">⏭ 건너뜀</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  app.innerHTML = html;
}

function setFilter(f) {
  currentFilter = f;
  render();
}

// FLASH CARD
function renderFlash(app) {
  const list = getFilteredWords();
  if (flashIdx >= list.length) flashIdx = 0;
  const stats = getStats();

  let html = `
  <div class="filter-bar">
    <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">전체</button>
    <button class="filter-btn ${currentFilter==='unknown'?'active':''}" onclick="setFilter('unknown')">모르는 단어</button>
    <button class="filter-btn ${currentFilter==='fav'?'active':''}" onclick="setFilter('fav')">⭐ 즐겨찾기</button>
  </div>
  <div class="stats-bar">
    <div class="progress-wrap"><div class="progress-fill" style="width:${stats.pct}%"></div></div>
    <div class="stats-text">✅${stats.known} / ${stats.total}</div>
  </div>
  <div class="flash-section">`;

  if (list.length === 0) {
    html += `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">해당하는 단어가 없습니다</div></div>`;
  } else {
    const w = list[flashIdx];
    html += `
    <div class="flash-counter">${flashIdx+1} / ${list.length}</div>
    <div class="flash-card touch-area" id="flashCard" onclick="toggleFlashMeaning()">
      <div class="flash-card-front">
        <div class="flash-word">${w.word}</div>
        <div class="flash-phonetic">
          [${w.phonetic}]
          <button class="wc-speak" onclick="event.stopPropagation();speak('${w.word.replace(/'/g,"\\'")}')">🔊</button>
        </div>
        <div class="flash-pos">${w.pos}</div>
        ${!flashShowMeaning ? '<div class="flash-tap-hint">탭하면 뜻 확인</div>' : ''}
      </div>
      <div class="flash-meaning-box ${flashShowMeaning?'show':''}">
        <div class="flash-meaning-text">${w.meaning}</div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="flash-nav-btn" onclick="flashMove(-1)">◀</button>
      <button class="flash-nav-btn" style="flex:2;font-size:13px;font-family:'Noto Sans KR',sans-serif;font-weight:600;" onclick="toggleFlashMeaning()">${flashShowMeaning?'뜻 숨기기':'뜻 보기'}</button>
      <button class="flash-nav-btn" onclick="flashMove(1)">▶</button>
    </div>
    <div class="flash-act-row">
      <button class="flash-act-btn ${w.status==='known'?'known':''}" onclick="setFlashStatus(${w.id},'known')">✅ 알아요</button>
      <button class="flash-act-btn ${w.status==='unknown'?'unknown':''}" onclick="setFlashStatus(${w.id},'unknown')">❌ 모름</button>
      <button class="flash-act-btn ${w.status==='skipped'?'skip':''}" onclick="setFlashStatus(${w.id},'skipped')">⏭ 건너뜀</button>
    </div>`;
  }
  html += `</div>`;
  app.innerHTML = html;

  // Swipe
  const fc = document.getElementById('flashCard');
  if (fc) {
    fc.addEventListener('touchstart', e => { flashTouchStartX = e.touches[0].clientX; }, {passive:true});
    fc.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - flashTouchStartX;
      if (Math.abs(dx) > 50) flashMove(dx < 0 ? 1 : -1);
    }, {passive:true});
  }
}

function toggleFlashMeaning() {
  const list = getFilteredWords();
  const w = list[flashIdx];
  flashShowMeaning = !flashShowMeaning;
  if (flashShowMeaning) speak(w.word);
  render();
}

function flashMove(dir) {
  const list = getFilteredWords();
  flashIdx = (flashIdx + dir + list.length) % list.length;
  flashShowMeaning = false;
  render();
}

function setFlashStatus(id, status) {
  const w = words.find(x => x.id === id);
  if (w) { w.status = w.status === status ? '' : status; saveStorage(); render(); }
}

// QUIZ
function startQuiz() {
  const pool = getFilteredWords();
  if (pool.length < 4) { alert('퀴즈를 위해 최소 4개 이상의 단어가 필요합니다.'); return; }
  const shuffled = [...pool].sort(() => Math.random()-0.5).slice(0, Math.min(10, pool.length));
  quizState = {
    questions: shuffled,
    current: 0,
    score: 0,
    answered: false,
    done: false
  };
  render();
}

function answerQuiz(choiceIdx) {
  if (!quizState || quizState.answered || quizState.done) return;
  const q = quizState.questions[quizState.current];
  quizState.answered = true;
  quizState.selectedIdx = choiceIdx;
  if (quizState.options[choiceIdx] === q.meaning) {
    quizState.score++;
  }
  render();
  setTimeout(() => {
    quizState.answered = false;
    quizState.current++;
    if (quizState.current >= quizState.questions.length) quizState.done = true;
    render();
  }, 900);
}

function renderQuiz(app) {
  let html = `
  <div class="filter-bar">
    <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">전체</button>
    <button class="filter-btn ${currentFilter==='unknown'?'active':''}" onclick="setFilter('unknown')">모르는 단어</button>
    <button class="filter-btn ${currentFilter==='fav'?'active':''}" onclick="setFilter('fav')">⭐ 즐겨찾기</button>
  </div>
  <div class="quiz-section">`;

  if (!quizState) {
    html += `<div class="quiz-start"><p style="font-size:14px;color:var(--text-sub);margin-bottom:20px;">10문제 · 4지선다<br>현재 필터 단어에서 출제</p><button class="quiz-start-btn" onclick="startQuiz()">퀴즈 시작 🚀</button></div>`;
  } else if (quizState.done) {
    const pct = Math.round(quizState.score / quizState.questions.length * 100);
    const emoji = pct>=90?'🎉':pct>=70?'😊':pct>=50?'🤔':'😅';
    html += `<div class="quiz-result">
      <div class="quiz-emoji">${emoji}</div>
      <div class="quiz-result-score">${quizState.score} / ${quizState.questions.length}</div>
      <div class="quiz-result-msg">${pct}점 · ${pct>=90?'완벽해요!':pct>=70?'잘했어요!':pct>=50?'조금 더 연습해요':'다시 도전해봐요'}</div>
      <button class="quiz-restart-btn" onclick="quizState=null;render()">다시 풀기</button>
    </div>`;
  } else {
    const q = quizState.questions[quizState.current];
    // Build options
    if (!quizState.answered || quizState.options === undefined) {
      // generate options once per question
      if (!quizState.currentQ || quizState.currentQ !== quizState.current) {
        quizState.currentQ = quizState.current;
        const pool = getFilteredWords();
        const wrongs = pool.filter(w => w.meaning !== q.meaning).sort(() => Math.random()-0.5).slice(0,3).map(w=>w.meaning);
        const opts = [...wrongs, q.meaning].sort(() => Math.random()-0.5);
        quizState.options = opts;
      }
    }
    const pct = Math.round(quizState.current / quizState.questions.length * 100);
    html += `
    <div class="quiz-header">
      <div class="quiz-score-badge">✅ ${quizState.score}점</div>
    </div>
    <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="quiz-question">
      <div class="quiz-q-label">문제 ${quizState.current+1} / ${quizState.questions.length} — 뜻을 고르세요</div>
      <div class="quiz-q-word">${q.word}</div>
      <div class="quiz-q-phonetic">[${q.phonetic}]</div>
    </div>
    <div class="quiz-options">`;
    quizState.options.forEach((opt, i) => {
      let cls = '';
      if (quizState.answered) {
        if (opt === q.meaning) cls = 'correct';
        else if (i === quizState.selectedIdx) cls = 'wrong';
      }
      html += `<button class="quiz-opt ${cls}" onclick="answerQuiz(${i})">${opt}</button>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
}

// Search
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.trim();
  currentTab = 'list';
  document.querySelectorAll('.tab-btn').forEach((b,i) => { b.classList.toggle('active', i===0); });
  render();
});

// Init
buildSegmentBar();
render();
</script>
</body>
</html>
