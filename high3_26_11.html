        .filters { display: flex; gap: 5px; padding: 10px 20px 0; }

        .progress-fill { height: 100%; background: #22C55E; transition: width 0.3s; width: 0%; }
        .stats { display: flex; justify-content: flex-end; font-size: 0.75rem; margin-top: 6px; color: var(--text-sub); font-weight: 700; }
        
        .word-list { padding: 0 20px; flex: 1; padding-bottom: 40px; }

        .word-info { flex: 1; }

        .word-info .kor { font-size: 1rem; margin-top: 8px; color: #334155; }
        .pos-tag { font-size: 0.7rem; color: var(--primary); background: #EFF6FF; padding: 2px 6px; border-radius: 4px; font-weight: 700; }

        .btn-sm { flex: 1; padding: 8px 0; font-size: 0.8rem; font-weight: 700; border-radius: 6px; border: 1px solid var(--border); background: white; cursor: pointer; }
        .btn-sm.know { color: #22C55E; border-color: #22C55E; }
        .btn-sm.no { color: #EF4444; border-color: #EF4444; }

            <div class="word-list" id="wordListArea"></div>
        </div>

        <div id="flashView" class="view flash-container">
            <div class="card" onclick="toggleMean()" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event)">

            </div>
            <div class="card-controls">
                <button class="btn-card" style="background:#FFEBEE; color:#C62828;" onclick="markStatusFlash('no')">❌ 모름</button>
                <button class="btn-card" style="background:#E8F5E9; color:#2E7D32;" onclick="markStatusFlash('know')">✅ 알아요</button>
                <button class="btn-card" style="background:#F1F5F9; color:#475569;" onclick="moveCard(1)">⏭️ 건너뜀</button>
            </div>
            <div id="cardCounter" style="margin-top:20px; color:var(--text-sub); font-weight:700;"></div>
        </div>

        <div id="quizView" class="view quiz-container">
            <div id="quizContent">
                <div id="quizQuestion" style="font-size:1.5rem; font-weight:700; text-align:center; margin:40px 0;"></div>
                <div class="quiz-options" id="quizOptions"></div>
            </div>
            <div id="quizResult" class="hidden" style="text-align:center; padding:40px;">
                <div id="resultEmoji" style="font-size:4rem;">🎉</div>
                <h2 id="resultScore"></h2>
                <button class="btn-card" style="background:var(--primary); color:white; margin-top:20px;" onclick="startQuiz()">다시 도전</button>
            </div>
        </div>

        let words = [], currentRange = 'all', currentFilter = 'all', activeTab = 'list', currentIndex = 0;
        let quizSet = [], quizIdx = 0, score = 0, flashWords = [];
        const saveKey = 'cutop_progress_' + encodeURIComponent('26년 고3 수능단어').substring(0, 20);

        // 스와이프 감지를 위한 변수
        let touchStartX = 0;
        let touchEndX = 0;
        let isSwiping = false;

        function init() {
            const lines = csvData.trim().split('\n');
            const saved = JSON.parse(localStorage.getItem(saveKey) || '{}');
            
            words = lines.map((line, idx) => {
                const parts = line.split('|');
                return {
                    id: idx,
                    word: parts[0],
                    phonetic: parts[1] || '',
                    meaning: parts[2] || '',
                    pos: parts[3] || '',
                    status: saved[idx]?.status || '', 
                    fav: saved[idx]?.fav || false
                };
            });
            
            renderRangeBar();
            renderList();
        }

        function save() {
            const data = {};
            words.forEach(w => { if(w.status || w.fav) data[w.id] = { status: w.status, fav: w.fav }; });
            localStorage.setItem(saveKey, JSON.stringify(data));
            updateFilterStats();
        }

        function renderRangeBar() {
            const bar = document.getElementById('rangeBar');
            let html = '<div class="range-btn ' + (currentRange === 'all' ? 'active' : '') + '" onclick="setRange(\'all\')">전체</div>';
            for(let i = 0; i < words.length; i += 10) {
                const rangeKey = i + '-' + (i + 10);
                html += '<div class="range-btn ' + (currentRange === rangeKey ? 'active' : '') + '" onclick="setRange(\'' + rangeKey + '\')">' + (i + 1) + '-' + Math.min(i + 10, words.length) + '</div>';
            }
            bar.innerHTML = html;
        }

        function setRange(range) {
            currentRange = range; 
            renderRangeBar();
            if(activeTab === 'list') renderList(); 
            else if(activeTab === 'flash') startFlash(); 
            else startQuiz();
        }

        function getRangeWords() {
            if(currentRange === 'all') return words;
            const parts = currentRange.split('-');
            return words.slice(parseInt(parts[0]), parseInt(parts[1]));
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('f-' + f).classList.add('active');
            renderList();
        }

        function updateFilterStats() {
            const total = words.length;
            const noCount = words.filter(w => w.status === 'no').length;
            const favCount = words.filter(w => w.fav).length;
            const knowCount = words.filter(w => w.status === 'know').length;
            
            document.getElementById('f-all').innerText = '전체 ' + total;
            document.getElementById('f-no').innerText = '모르는 단어 ' + noCount;
            document.getElementById('f-fav').innerText = '⭐ 즐겨찾기 ' + favCount;
            
            const percent = total > 0 ? Math.round((knowCount / total) * 100) : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentText').innerText = '✅ ' + knowCount + ' ❌ ' + noCount + ' / ' + total;
        }

        function renderList() {
            updateFilterStats();
            const query = document.getElementById('searchInput').value.toLowerCase();
            const area = document.getElementById('wordListArea');
            
            let filtered = getRangeWords();
            
            if (currentFilter === 'no') filtered = filtered.filter(w => w.status === 'no');
            if (currentFilter === 'fav') filtered = filtered.filter(w => w.fav);
            
            filtered = filtered.filter(w => w.word.toLowerCase().includes(query) || w.meaning.includes(query));
            
            area.innerHTML = filtered.map(w => '<div class="word-item"><div class="word-info"><div class="eng">' + (w.id + 1) + '. ' + w.word + '<span class="pos-tag">' + w.pos + '</span></div><div style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;">' + w.phonetic + ' <span class="audio-btn" onclick="speak(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</span></div><div class="kor">' + w.meaning + '</div><div class="card-actions"><button class="btn-sm ' + (w.status==='know'?'know':'') + '" onclick="markStatusList(' + w.id + ', \'know\')">✅ 알아요</button><button class="btn-sm ' + (w.status==='no'?'no':'') + '" onclick="markStatusList(' + w.id + ', \'no\')">❌ 모름</button></div></div><div class="fav-btn ' + (w.fav ? 'active' : '') + '" onclick="toggleFav(' + w.id + ')">★</div></div>').join('');
        }

        function markStatusList(id, status) {
            words[id].status = words[id].status === status ? '' : status; 
            save();
            renderList();
        }

        function toggleFav(id) {
            words[id].fav = !words[id].fav;
            save();
            renderList();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText.includes(tab === 'list' ? '목록' : tab === 'flash' ? '카드' : '퀴즈')));
            document.querySelectorAll('.view').forEach(v => { v.style.display = 'none'; v.classList.remove('flash-container'); });
            
            const target = document.getElementById(tab + 'View');
            target.style.display = 'flex';
            if(tab === 'flash') target.classList.add('flash-container');
            if(tab === 'list') target.style.display = 'block';
            
            if(tab === 'list') renderList(); 
            else if(tab === 'flash') startFlash(); 
            else startQuiz();
        }

        function startFlash() { 
            flashWords = getRangeWords(); 
            if(currentFilter === 'no') flashWords = flashWords.filter(w => w.status === 'no');
            if(currentFilter === 'fav') flashWords = flashWords.filter(w => w.fav);
            
            currentIndex = 0; 
            showCard(); 
        }

        function showCard() {
            if(!flashWords.length) {
                document.getElementById('cardEng').innerText = "단어가 없습니다.";
                document.getElementById('cardPhonetic').innerText = "";
                document.getElementById('cardKor').innerText = "";
                document.getElementById('cardPos').innerText = "";
                document.getElementById('cardMeanArea').classList.remove('show');
                document.getElementById('cardCounter').innerText = "";
                return;
            }
            const w = flashWords[currentIndex];
            document.getElementById('cardEng').innerText = w.word;
            document.getElementById('cardPhonetic').innerText = w.phonetic;
            document.getElementById('cardKor').innerText = w.meaning;
            document.getElementById('cardPos').innerText = w.pos;
            document.getElementById('cardMeanArea').classList.remove('show');
            document.getElementById('cardCounter').innerText = (currentIndex + 1) + ' / ' + flashWords.length;
        }

        function toggleMean() { 
            if(isSwiping) return; // 스와이프 중일 때는 클릭 동작(의미 보기) 방지
            if(!flashWords.length) return;
            const area = document.getElementById('cardMeanArea');
            if(!area.classList.contains('show')) { 
                area.classList.add('show'); 
                speak(flashWords[currentIndex].word); 
            }
        }

        function markStatusFlash(s) { 
            if(!flashWords.length) return;
            words[flashWords[currentIndex].id].status = s; 
            save(); 
            moveCard(1); 
        }

        function moveCard(step) { 
            if(!flashWords.length) return; 
            currentIndex = (currentIndex + step + flashWords.length) % flashWords.length; 
            showCard(); 
        }

        // 터치 시작 이벤트 핸들러
        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
            isSwiping = false; // 플래그 초기화
        }

        // 터치 종료 이벤트 핸들러
        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            const swipeThreshold = 50; // 이 픽셀 이상 움직이면 스와이프로 인식
            
            if (touchStartX - touchEndX > swipeThreshold) {
                isSwiping = true;
                moveCard(1); // 왼쪽으로 밀었을 때: 다음 카드
            } else if (touchEndX - touchStartX > swipeThreshold) {
                isSwiping = true;
                moveCard(-1); // 오른쪽으로 밀었을 때: 이전 카드
            }
        }

        function startQuiz() {
            const pool = getRangeWords();
            if(pool.length < 4) { alert('해당 구간에 단어가 최소 4개 이상 필요합니다.'); switchTab('list'); return; }
            quizSet = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
            quizIdx = 0; score = 0;
            document.getElementById('quizContent').classList.remove('hidden');
            document.getElementById('quizResult').classList.add('hidden');
            showQuiz();
        }

        function showQuiz() {
            const q = quizSet[quizIdx];
            document.getElementById('quizQuestion').innerText = q.word;
            speak(q.word);
            let opts = [q.meaning];
            while(opts.length < 4) { 
                const r = words[Math.floor(Math.random() * words.length)].meaning; 
                if(!opts.includes(r)) opts.push(r); 
            }
            document.getElementById('quizOptions').innerHTML = opts.sort(() => Math.random() - 0.5).map(o => '<div class="option" onclick="checkQuiz(this, \'' + q.meaning.replace(/'/g, "\\'") + '\')">' + o + '</div>').join('');
        }

        function checkQuiz(el, cor) {
            if(document.querySelector('.option.correct')) return;
            if(el.innerText === cor) { el.classList.add('correct'); score++; } else el.classList.add('wrong');
            setTimeout(() => { 
                quizIdx++; 
                if(quizIdx < quizSet.length) showQuiz(); 
                else { 
                    document.getElementById('quizContent').classList.add('hidden'); 
                    document.getElementById('quizResult').classList.remove('hidden'); 
                    document.getElementById('resultScore').innerText = score + ' / ' + quizSet.length; 
                } 
            }, 1000);
        }

        function speak(text) { 
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const u = new SpeechSynthesisUtterance(text); 
                u.lang = 'en-US'; 
                u.rate = 0.85; 
                window.speechSynthesis.speak(u); 
            }
        }
        function speakCurrent(e) { 
            e.stopPropagation(); 
            if(flashWords.length) speak(flashWords[currentIndex].word); 
        }

        window.onload = init;
    </script>
