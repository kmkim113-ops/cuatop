    // LocalStorage State Management with Protected Mapping Expressions
    let wordState = JSON.parse(localStorage.getItem('cu_top_state_2611')) || {};
    
    let words = rawWords.map((w, index) => ({
        ...w,
        id: index,
        fav: wordState[index]?.fav || false,
        status: wordState[index]?.status || '' // 'know', 'unknown', ''
    }));

    let currentTab = 'list';
    let selectedRange = 'all'; // 'all' or index (0, 1, 2...)
    let currentFilter = 'all'; // 'all', 'unknown', 'fav'
    let searchQuery = '';

    // Flashcard State
    let flashIndex = 0;
    let isMeanShown = false;
    let filteredFlashWords = [];

    // Quiz State
    let quizIndex = 0;
    let quizScore = 0;
    let quizWords = [];
    let isQuizAnswered = false;

    const ITEMS_PER_PAGE = 10;

    function saveState() {
        let stateToSave = {};
        words.forEach(w => {
            if(w.fav || w.status) {
                stateToSave[w.id] = { fav: w.fav, status: w.status };
            }
        });
        localStorage.setItem('cu_top_state_2611', JSON.stringify(stateToSave));
    }

    // TTS Utility
    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    // Initialize Range Selection UI
    function initRangeBar() {
        const rangeBar = document.getElementById('rangeBar');
        let html = `<div class="range-item active" id="range-all" onclick="setRange('all')">전체</div>`;
        
        const totalRanges = Math.ceil(words.length / ITEMS_PER_PAGE);
        for(let i=0; i<totalRanges; i++) {
            const start = i * ITEMS_PER_PAGE + 1;
            const end = Math.min((i + 1) * ITEMS_PER_PAGE, words.length);
            html += `<div class="range-item" id="range-${i}" onclick="setRange(${i})">${start}-${end}</div>`;
        }
        rangeBar.innerHTML = html;
    }

    function setRange(range) {
        selectedRange = range;
        document.querySelectorAll('.range-item').forEach(el => el.classList.remove('active'));
        if(range === 'all') {
            document.getElementById('range-all').classList.add('active');
        } else {
            document.getElementById(`range-${range}`).classList.add('active');
        }
        renderCurrentView();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', ['list', 'flash', 'quiz'][idx] === tab);
        });
        
        const listFilterArea = document.getElementById('listFilterArea');
        if (tab === 'list') {
            listFilterArea.style.display = 'flex';
        } else {
            listFilterArea.style.display = 'none';
        }

        document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
        document.getElementById(`panel-${tab}`).classList.add('active');

        if(tab === 'flash') initFlashcards();
        if(tab === 'quiz') initQuiz();
        renderCurrentView();
    }

    function getFilteredWords() {
        return words.filter(w => {
            // Range Filter
            if (selectedRange !== 'all') {
                const idx = words.indexOf(w);
                if (idx < selectedRange * ITEMS_PER_PAGE || idx >= (selectedRange + 1) * ITEMS_PER_PAGE) {
                    return false;
                }
            }
            // Tab Specific Filters for List View
            if (currentTab === 'list') {
                if (currentFilter === 'unknown' && w.status !== 'unknown') return false;
                if (currentFilter === 'fav' && !w.fav) return false;
                
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    return w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q);
                }
            }
            return true;
        });
    }

    function renderCurrentView() {
        if(currentTab === 'list') renderWordList();
        if(currentTab === 'flash') renderFlashcard();
    }

    // List Panel Logic
    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value;
        renderWordList();
    }

    function setFilter(type) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`f-${type}`).classList.add('active');
        renderWordList();
    }

    function toggleFav(id, e) {
        if(e) e.stopPropagation();
        const target = words.find(w => w.id === id);
        target.fav = !target.fav;
        saveState();
        renderCurrentView();
    }

    function setStatus(id, status, e) {
        if(e) e.stopPropagation();
        const target = words.find(w => w.id === id);
        target.status = target.status === status ? '' : status;
        saveState();
        renderCurrentView();
    }

    function renderWordList() {
        const targetList = getFilteredWords();
        const listArea = document.getElementById('wordListArea');
        
        if(targetList.length === 0) {
            listArea.innerHTML = `<div class="empty-msg">해당 조건에 부합하는 단어가 없습니다.</div>`;
            return;
        }

        listArea.innerHTML = targetList.map(w => `
            <div class="word-item ${w.status === 'know' ? 'know' : ''}">
                <div class="word-top">
                    <div class="word-eng-box">
                        <span class="word-eng">${w.word}</span>
                        <span class="word-pos">${w.pos}</span>
                    </div>
                    <div class="word-actions">
                        <button class="btn-icon audio" onclick="playAudio('${w.word.replace(/'/g, "\\'")}')">🔊</button>
                        <button class="btn-icon fav ${w.fav ? 'active' : ''}" onclick="toggleFav(${w.id}, event)">⭐</button>
                    </div>
                </div>
                <div class="word-phonetic">${w.phonetic}</div>
                <div class="word-mean">${w.meaning}</div>
                <div class="word-status-btns">
                    <button class="status-btn know-btn ${w.status === 'know' ? 'active' : ''}" onclick="setStatus(${w.id}, 'know', event)">알아요</button>
                    <button class="status-btn unknown-btn ${w.status === 'unknown' ? 'active' : ''}" onclick="setStatus(${w.id}, 'unknown', event)">모름</button>
                </div>
            </div>
        `).join('');
    }

    // Flashcard Panel Logic
    function initFlashcards() {
        filteredFlashWords = getFilteredWords();
        flashIndex = 0;
        isMeanShown = false;
    }

    function renderFlashcard() {
        const area = document.getElementById('flashcardArea');
        if(filteredFlashWords.length === 0) {
            area.innerHTML = `<div class="empty-msg">해당 조건 범위 내 수록된 단어가 없습니다.</div>`;
            return;
        }

        const w = filteredFlashWords[flashIndex];
        area.innerHTML = `
            <div class="fc-progress">${flashIndex + 1} / ${filteredFlashWords.length}</div>
            <div class="flashcard" onclick="revealFlashcardMean('${w.word.replace(/'/g, "\\'")}')">
                <button class="fc-fav ${w.fav ? 'active' : ''}" onclick="toggleFav(${w.id}, event); event.stopPropagation(); initFlashcards(); renderFlashcard();">⭐</button>
                <div class="fc-eng">${w.word}</div>
                <div class="fc-phonetic">${w.phonetic} [${w.pos}]</div>
                <div class="fc-mean ${isMeanShown ? 'show' : ''}">${w.meaning}</div>
                <div class="fc-hint">💡 카드를 터치하면 뜻 확인 및 발음이 재생됩니다</div>
            </div>
            <div class="flashcard-controls">
                <button class="fc-btn yes" onclick="handleCardAction('know')">알아요</button>
                <button class="fc-btn no" onclick="handleCardAction('unknown')">모름</button>
                <button class="fc-btn skip" onclick="handleCardAction('skip')">넘기기</button>
            </div>
        `;

        // Interactive Module Swipe binding
        const cardElement = area.querySelector('.flashcard');
        let startX = 0;
        cardElement.addEventListener('touchstart', (e) => { startX = e.changedTouches[0].screenX; }, {passive: true});
        cardElement.addEventListener('touchend', (e) => {
            if(Math.abs(e.changedTouches[0].screenX - startX) > 50) handleCardAction('skip');
        }, {passive: true});
    }

    function revealFlashcardMean(wordText) {
        if(!isMeanShown) {
            isMeanShown = true;
            document.querySelector('.fc-mean').classList.add('show');
            playAudio(wordText);
        }
    }

    function handleCardAction(action) {
        const currentWord = filteredFlashWords[flashIndex];
        if(action === 'know') currentWord.status = 'know';
        if(action === 'unknown') currentWord.status = 'unknown';
        saveState();

        isMeanShown = false;
        if(flashIndex < filteredFlashWords.length - 1) {
            flashIndex++;
            renderFlashcard();
        } else {
            alert('마지막 카드입니다. 첫 카드로 돌아갑니다.');
            flashIndex = 0;
            renderFlashcard();
        }
    }

    // Quiz Panel Logic
    function initQuiz() {
        const source = getFilteredWords();
        if(source.length < 4) {
            quizWords = [];
            return;
        }
        // Randomly select 10 unique elements
        let shuffled = [...source].sort(() => 0.5 - Math.random());
        quizWords = shuffled.slice(0, Math.min(10, shuffled.length));
        quizIndex = 0;
        quizScore = 0;
        isQuizAnswered = false;
    }

    function renderQuizQuestion() {
        const area = document.getElementById('quizArea');
        if(quizWords.length === 0) {
            area.innerHTML = `<div class="empty-msg">퀴즈를 출제하려면 구간에 최소 4개 이상의 단어가 필요합니다.</div>`;
            return;
        }

        const q = quizWords[quizIndex];
        
        // Generate options
        let options = [q.meaning];
        let pool = rawWords.filter(w => w.meaning !== q.meaning).map(w => w.meaning);
        let shuffledPool = pool.sort(() => 0.5 - Math.random());
        for(let i=0; i<3; i++) {
            if(shuffledPool[i]) options.push(shuffledPool[i]);
        }
        options.sort(() => 0.5 - Math.random());

        area.innerHTML = `
            <div class="quiz-q-box">
                <div class="quiz-progress">문제 ${quizIndex + 1} / ${quizWords.length}</div>
                <div class="quiz-word">${q.word}</div>
            </div>
            <div class="quiz-options">
                ${options.map((opt, i) => `
                    <button class="quiz-opt" onclick="submitQuizAnswer(this, '${opt === q.meaning}', '${q.meaning.replace(/'/g, "\\'")}')">${i+1}. ${opt}</button>
                `).join('')}
            </div>
        `;
        
        isQuizAnswered = false;
        // Pronounce target question
        setTimeout(() => playAudio(q.word), 200);
    }

    function submitQuizAnswer(btnEl, isCorrect, correctMean) {
        if(isQuizAnswered) return;
        isQuizAnswered = true;

        const isTrue = isCorrect === 'true';
        if(isTrue) {
            btnEl.classList.add('correct');
            quizScore++;
        } else {
            btnEl.classList.add('wrong');
            // Flash matching correction target highlight
            document.querySelectorAll('.quiz-opt').forEach(btn => {
                if(btn.innerText.includes(correctMean)) btn.classList.add('correct');
            });
        }

        setTimeout(() => {
            if(quizIndex < quizWords.length - 1) {
                quizIndex++;
                renderQuizQuestion();
            } else {
                renderQuizResult();
            }
        }, 1200);
    }

    function renderQuizResult() {
        const area = document.getElementById('quizArea');
        const pct = (quizScore / quizWords.length) * 100;
        let emo = '🔥';
        let msg = '훌륭합니다! 수능 만점을 향해 고고!';
        if(pct < 80) { emo = '✨'; msg = '조금만 더 집중해서 완벽하게 외워봐요!'; }
        if(pct < 50) { emo = '🌱'; msg = '틀린 단어들을 단어목록에서 다시 확인해보세요!'; }

        area.innerHTML = `
            <div class="quiz-result-view">
                <div class="quiz-score-circle">${quizScore} / ${quizWords.length}</div>
                <div class="quiz-feedback">${emo} ${msg}</div>
                <button class="quiz-reset-btn" onclick="initQuiz(); renderQuizQuestion();">다시 도전하기</button>
            </div>
        `;
    }

    function initQuiz() {
        const source = getFilteredWords();
        if(source.length < 4) {
            quizWords = [];
            return;
        }
        let shuffled = [...source].sort(() => 0.5 - Math.random());
        quizWords = shuffled.slice(0, Math.min(10, shuffled.length));
        quizIndex = 0;
        quizScore = 0;
        isQuizAnswered = false;
    }

    // App Initialization Engine
    window.onload = function() {
        initRangeBar();
        renderWordList();
    };
</script>

</body>
</html>
