        :root {

            --text-sub: #4B5563;
            --text-light: #9CA3AF;
            --bg-body: #F3F4F6;
            --bg-card: #FFFFFF;

            padding: 0;

        }

        body {

            justify-content: center;
            align-items: flex-start;

        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);

            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        header {
            padding: 20px 16px 12px 16px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-brand span {
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        .nav-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .tab-btn {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-sub);
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary);
            font-weight: 700;
            border-bottom-color: var(--primary);
        }

        .range-container {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background-color: #FAFAFA;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            white-space: nowrap;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }

        .range-container::-webkit-scrollbar {
            display: none;
        }

        .range-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 20px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-sub);
            cursor: pointer;
        }

        .range-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #FFFFFF;
            font-weight: 700;
        }

        .content-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-tag {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            background-color: var(--bg-body);
            color: var(--text-sub);
            cursor: pointer;
            border: none;
        }

        .filter-tag.active {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-info .eng {
            font-family: 'Nunito', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .word-info .pho {
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            color: var(--text-light);
            margin: 2px 0 4px 0;
        }

        .word-info .kor {
            font-size: 14px;
            color: var(--text-sub);
        }

        .word-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.2s ease;
        }

        .card-stats {
            font-size: 12px;
            color: var(--text-sub);
            text-align: right;
            margin-bottom: 20px;
        }

        .flashcard {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            min-height: 240px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 24px;
            user-select: none;
        }

        .card-word {
            font-family: 'Nunito', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-phonetic {
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            color: var(--text-light);
            margin-top: 6px;
        }

            padding-top: 16px;
            border-top: 1px dashed var(--border);
            width: 100%;
            display: none;
        }

        }

            font-size: 11px;
            color: var(--primary);
            background-color: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;

        .card-meaning {

            font-weight: 500;

        }

            bottom: 12px;
            font-size: 11px;
            color: var(--text-light);
        }

        .card-controls {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {

            padding: 14px 0;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: white;

        .ctrl-btn.know { background-color: var(--accent-know); }

            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;

            font-size: 24px;
            font-weight: 700;
            text-align: center;

            flex-direction: column;
            gap: 10px;
        }

            padding: 14px;
            text-align: left;
            border: 1px solid var(--border);
            background: var(--bg-card);
            border-radius: 8px;
            font-size: 14px;

            padding: 4px 0;
        }

            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;

            font-size: 16px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.5;
        }

            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <header>
        <div class="header-brand">씨유에탑 <span>✦</span> 영어단어장</div>
        <div class="header-subtitle" id="dynamicSubtitle">25년11월고3수능영단어 · 총 202단어</div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('list')">단어목록</button>
        <button class="tab-btn" onclick="switchView('card')">플래시카드</button>
        <button class="tab-btn" onclick="switchView('quiz')">퀴즈</button>
    </nav>

    <div class="range-container" id="rangeBar"></div>

    <main class="content-area">
        <section id="view-list" class="view-section active">
            <input type="text" class="search-box" id="searchInput" placeholder="단어 또는 뜻 검색..." oninput="renderList()">
            <div class="filter-tags">
                <button class="filter-tag active" id="flt-all" onclick="setFilter('all')">전체</button>
                <button class="filter-tag" id="flt-unknown" onclick="setFilter('unknown')">모르는 단어</button>
                <button class="filter-tag" id="flt-fav" onclick="setFilter('fav')">⭐ 즐겨찾기</button>
            </div>
            <div class="word-list" id="wordListZone"></div>
        </section>

        <section id="view-card" class="view-section">
            <div class="progress-bar-container"><div class="progress-bar" id="cardProgress"></div></div>
            <div class="card-stats" id="cardStatsText">0 / 0</div>
            
            <div class="flashcard" id="mainFlashcard" onclick="toggleCardMeaning()">
                <div class="card-word" id="cWord">-</div>
                <div class="card-phonetic" id="cPhonetic">-</div>
                <div class="card-meaning-zone" id="cMeaningZone">
                    <div class="card-pos" id="cPos">-</div>
                    <div class="card-meaning" id="cMeaning">-</div>
                </div>
                <div class="card-hint" id="cHint">카드를 터치하면 뜻이 나타납니다 (좌우 스와이프 가능)</div>
            </div>
            
            <div class="card-controls">
                <button class="ctrl-btn dontknow" onclick="handleCardReview(false)">모름 (←)</button>
                <button class="ctrl-btn" style="background-color: var(--text-light);" onclick="playTTS(words[filteredIndices[currentCardIdx]].word)">🔊 발음</button>
                <button class="ctrl-btn know" onclick="handleCardReview(true)">(→) 알아요</button>
            </div>
        </section>

        <section id="view-quiz" class="view-section">
            <div id="quizActiveZone">
                <div class="progress-bar-container"><div class="progress-bar" id="quizProgress"></div></div>
                <div class="card-stats" id="quizStatsText">문제 1 / 10</div>
                <div class="quiz-container">
                    <div class="quiz-question" id="qWord">-</div>
                    <div class="quiz-options" id="qOptionsZone"></div>
                </div>
            </div>
            <div id="quizResultZone" class="view-section">
                <div class="quiz-container quiz-result">
                    <h2>퀴즈 결과</h2>
                    <div class="result-score" id="resScore">0점</div>
                    <div class="result-feedback" id="resFeedback">-</div>
                    <button class="restart-btn" onclick="startQuiz()">다시 도전하기</button>
                </div>
            </div>
        </section>
    </main>
</div>

    // 지침: 스프레드 연산자 사용 시 괄호로 완벽하게 감싸기 준수
    let words = rawData.map(w => ({...w, fav: false, unknown: false}));

    let currentRangeIdx = -1; 
    let currentFilter = 'all'; 
    let currentCardIdx = 0;
    let filteredIndices = [];

    const STORAGE_KEY = 'cutop_progress_25_11_go3_vfinal';

    function init() {
        loadProgress();
        renderRangeBar();
        updateFilteredIndices();
        renderList();
        initCard();
        initSwipe();
    }

    function saveProgress() {
        const savedData = words.map(w => ({w: w.word, f: w.fav, u: w.unknown}));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
    }

    function loadProgress() {
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
            try {
                const parsed = JSON.parse(local);
                parsed.forEach(p => {
                    let w = words.find(item => item.word === p.w);
                    if (w) {
                        w.fav = p.f;
                        w.unknown = p.u;
                    }
                });
            } catch(e) {}
        }
    }

    function switchView(view) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', ['list','card','quiz'][idx] === view);
        });
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(`view-${view}`).classList.add('active');
        
        if (view === 'list') {
            renderList();
        } else if (view === 'card') {
            currentCardIdx = 0;
            initCard();
        } else if (view === 'quiz') {
            startQuiz();
        }
    }

    function renderRangeBar() {
        const bar = document.getElementById('rangeBar');
        bar.innerHTML = '';
        
        let allBtn = document.createElement('button');
        allBtn.className = `range-btn ${currentRangeIdx === -1 ? 'active' : ''}`;
        allBtn.innerText = '전체';
        allBtn.onclick = () => selectRange(-1);
        bar.appendChild(allBtn);

        const totalChunks = Math.ceil(words.length / 10);
        for(let i=0; i<totalChunks; i++) {
            let start = i * 10 + 1;
            let end = Math.min((i + 1) * 10, words.length);
            let btn = document.createElement('button');
            btn.className = `range-btn ${currentRangeIdx === i ? 'active' : ''}`;
            btn.innerText = `${start}-${end}`;
            btn.onclick = () => selectRange(i);
            bar.appendChild(btn);
        }
    }

    function selectRange(idx) {
        currentRangeIdx = idx;
        renderRangeBar();
        updateFilteredIndices();
        
        if (document.getElementById('view-list').classList.contains('active')) renderList();
        if (document.getElementById('view-card').classList.contains('active')) { currentCardIdx = 0; initCard(); }
        if (document.getElementById('view-quiz').classList.contains('active')) startQuiz();
    }

    function setFilter(type) {
        currentFilter = type;
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.classList.toggle('active', tag.id === `flt-${type}`);
        });
        updateFilteredIndices();
        renderList();
    }

    function updateFilteredIndices() {
        let indices = [];
        let start = currentRangeIdx === -1 ? 0 : currentRangeIdx * 10;
        let end = currentRangeIdx === -1 ? words.length : Math.min(start + 10, words.length);

        for (let i = start; i < end; i++) {
            let w = words[i];
            
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            if (search && !(w.word.toLowerCase().includes(search) || w.meaning.includes(search))) {
                continue;
            }

            if (currentFilter === 'unknown' && !w.unknown) continue;
            if (currentFilter === 'fav' && !w.fav) continue;

            indices.push(i);
        }
        filteredIndices = indices;
    }

    function renderList() {
        updateFilteredIndices();
        const zone = document.getElementById('wordListZone');
        zone.innerHTML = '';

        if(filteredIndices.length === 0) {
            zone.innerHTML = `<div style="text-align:center; color:var(--text-light); padding:40px 0; font-size:14px;">조건에 맞는 단어가 없습니다.</div>`;
            return;
        }

        filteredIndices.forEach(idx => {
            let w = words[idx];
            let item = document.createElement('div');
            item.className = 'word-item';
            item.innerHTML = `
                <div class="word-info">
                    <div class="eng">${w.word}</div>
                    <div class="pho">${w.phonetic}</div>
                    <div class="kor"><span style="color:var(--primary); font-size:12px; font-weight:700; margin-right:4px;">[${w.pos}]</span>${w.meaning}</div>
                </div>
                <div class="word-actions">
                    <button class="action-btn" onclick="toggleWordUnknown(${idx}, event)">${w.unknown ? '🔴' : '⚪'}</button>
                    <button class="action-btn" onclick="toggleWordFav(${idx}, event)">${w.fav ? '⭐' : '☆'}</button>
                </div>
            `;
            zone.appendChild(item);
        });
    }

    function toggleWordFav(idx, e) {
        e.stopPropagation();
        words[idx].fav = !words[idx].fav;
        saveProgress();
        renderList();
    }

    function toggleWordUnknown(idx, e) {
        e.stopPropagation();
        words[idx].unknown = !words[idx].unknown;
        saveProgress();
        renderList();
    }

    function playTTS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }
    }

    function initCard() {
        if(filteredIndices.length === 0) {
            document.getElementById('cardProgress').style.width = '0%';
            document.getElementById('cardStatsText').innerText = '0 / 0';
            document.getElementById('cWord').innerText = '단어 없음';
            document.getElementById('cPhonetic').innerText = '';
            document.getElementById('cMeaningZone').classList.remove('show');
            return;
        }

        if (currentCardIdx >= filteredIndices.length) currentCardIdx = 0;

        const w = words[filteredIndices[currentCardIdx]];
        document.getElementById('cWord').innerText = w.word;
        document.getElementById('cPhonetic').innerText = w.phonetic;
        document.getElementById('cPos').innerText = w.pos;
        document.getElementById('cMeaning').innerText = w.meaning;
        
        document.getElementById('cMeaningZone').classList.remove('show');

        const progressPercent = ((currentCardIdx + 1) / filteredIndices.length) * 100;
        document.getElementById('cardProgress').style.width = `${progressPercent}%`;
        document.getElementById('cardStatsText').innerText = `${currentCardIdx + 1} / ${filteredIndices.length}`;
    }

    function toggleCardMeaning() {
        const zone = document.getElementById('cMeaningZone');
        if(!zone.classList.contains('show')) {
            zone.classList.add('show');
            playTTS(words[filteredIndices[currentCardIdx]].word);
        } else {
            zone.classList.remove('show');
        }
    }

    function handleCardReview(know) {
        if (filteredIndices.length === 0) return;
        
        const originalIdx = filteredIndices[currentCardIdx];
        words[originalIdx].unknown = !know;
        saveProgress();

        if(currentCardIdx < filteredIndices.length - 1) {
            currentCardIdx++;
            initCard();
        } else {
            alert('해당 구간의 마지막 카드입니다. 첫 카드로 돌아갑니다.');
            currentCardIdx = 0;
            initCard();
        }
    }

    // 지침: 스와이프 기능 완벽 구현
    function initSwipe() {
        let touchstartX = 0;
        let touchendX = 0;
        
        const flashcard = document.getElementById('mainFlashcard');
        flashcard.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});
        
        flashcard.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 60) handleCardReview(false); // 왼쪽 스와이프: 모름
            if (touchendX > touchstartX + 60) handleCardReview(true);  // 오른쪽 스와이프: 알아요
        }, {passive: true});
    }

    let quizQuestions = [];
    let quizCurrentIdx = 0;
    let quizScore = 0;

    function startQuiz() {
        document.getElementById('quizActiveZone').classList.add('active');
        document.getElementById('quizResultZone').classList.remove('active');
        
        if (filteredIndices.length === 0) {
            document.getElementById('qWord').innerText = '단어 데이터 부족';
            document.getElementById('qOptionsZone').innerHTML = '구간에 수록된 단어가 없습니다.';
            return;
        }

        let pool = [...filteredIndices].sort(() => 0.5 - Math.random());
        quizQuestions = pool.slice(0, Math.min(10, pool.length));
        quizCurrentIdx = 0;
        quizScore = 0;

        renderQuizQuestion();
    }

    function renderQuizQuestion() {
        const totalQ = quizQuestions.length;
        const progressPercent = ((quizCurrentIdx) / totalQ) * 100;
        document.getElementById('quizProgress').style.width = `${progressPercent}%`;
        document.getElementById('quizStatsText').innerText = `문제 ${quizCurrentIdx + 1} / ${totalQ}`;

        const currentTargetIdx = quizQuestions[quizCurrentIdx];
        const correctWord = words[currentTargetIdx];

        document.getElementById('qWord').innerText = correctWord.word;
        playTTS(correctWord.word);

        let options = [correctWord.meaning];
        let wrongPool = words.filter((_, idx) => idx !== currentTargetIdx).map(w => w.meaning);
        wrongPool = [...new Set(wrongPool)].sort(() => 0.5 - Math.random());
        
        for(let i=0; i<3; i++) {
            if(wrongPool[i]) options.push(wrongPool[i]);
        }
        
        options.sort(() => 0.5 - Math.random());

        const optionZone = document.getElementById('qOptionsZone');
        optionZone.innerHTML = '';
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleQuizAnswer(opt === correctWord.meaning);
            optionZone.appendChild(btn);
        });
    }

    function handleQuizAnswer(isCorrect) {
        if(isCorrect) quizScore += Math.round(100 / quizQuestions.length);
        
        if(quizCurrentIdx < quizQuestions.length - 1) {
            quizCurrentIdx++;
            renderQuizQuestion();
        } else {
            showQuizResult();
        }
    }

    function showQuizResult() {
        if(quizScore > 100) quizScore = 100;
        document.getElementById('quizActiveZone').classList.remove('active');
        document.getElementById('quizResultZone').classList.add('active');
        
        document.getElementById('resScore').innerText = `${quizScore}점`;
        
        let feedback = '';
        if(quizScore === 100) feedback = '🔥 완벽합니다! 모든 수능 단어를 마스터하셨네요!';
        else if(quizScore >= 80) feedback = '🌟 대단해요! 완벽에 한 걸음 더 가까워졌습니다.';
        else if(quizScore >= 50) feedback = '👍 잘하고 있습니다! 틀린 단어들을 복습해 보세요.';
        else feedback = '📚 조금 더 집중해서 다시 도전해 볼까요? 할 수 있습니다!';
        
        document.getElementById('resFeedback').innerText = feedback;
        document.getElementById('quizProgress').style.width = '100%';
    }

    window.onload = init;
</script>
</body>
