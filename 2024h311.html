  let words = [];
  let currentTab = 'list';
  let selectedRange = 'all'; 
  let currentFilter = 'all'; 

  // 플래시카드 상태
  let flashIdx = 0;
  let flashWords = [];
  let touchStartX = 0;

  // 퀴즈 상태
  let quizWords = [];
  let quizIdx = 0;
  let quizScore = 0;
  let quizLog = [];

  function init() {
    const localData = localStorage.getItem('cu_top_sync_2024_g3_11');
    if (localData) {
      words = JSON.parse(localData);
    } else {
      words = rawData.map(w => ({ ...w, fav: false, status: '' }));
      saveState();
    }
    document.getElementById('sub-title').innerText = `2024년 고3 11월 수능단어 · 총 ${words.length}단어`;
    buildRangeBar();
    switchTab('list');
  }

  function saveState() {
    localStorage.setItem('cu_top_sync_2024_g3_11', JSON.stringify(words));
  }

  function buildRangeBar() {
    const bar = document.getElementById('range-bar');
    let html = `<span class="range-chip active" id="rc-all" onclick="setRange('all')">전체</span>`;
    const chunkSize = 10;
    const total = words.length;
    let chunkCount = Math.ceil(total / chunkSize);

    for (let i = 0; i < chunkCount; i++) {
      let start = i * chunkSize + 1;
      let end = Math.min((i + 1) * chunkSize, total);
      html += `<span class="range-chip" id="rc-${i}" onclick="setRange(${i}, ${start}, ${end})">${start}-${end}</span>`;
    }
    bar.innerHTML = html;
  }

  function setRange(idx, start, end) {
    document.querySelectorAll('.range-chip').forEach(c => c.classList.remove('active'));
    if (idx === 'all') {
      selectedRange = 'all';
      document.getElementById('rc-all').classList.add('active');
    } else {
      selectedRange = { start, end, idx };
      document.getElementById(`rc-${idx}`).classList.add('active');
    }
    refreshCurrentTab();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    
    if (tab === 'list') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-list').classList.add('active');
      renderList();
    } else if (tab === 'flash') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-flash').classList.add('active');
      initFlash();
    } else if (tab === 'quiz') {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('tab-quiz').classList.add('active');
      initQuiz();
    }
  }

  function refreshCurrentTab() {
    if (currentTab === 'list') renderList();
    else if (currentTab === 'flash') initFlash();
    else if (currentTab === 'quiz') initQuiz();
  }

  function getFilteredRangeWords() {
    if (selectedRange === 'all') return words;
    return words.slice(selectedRange.start - 1, selectedRange.end);
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }
  }

  /* 단어 목록 파트 */
  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (f === 'all') document.getElementById('f-all').classList.add('active');
    if (f === 'wrong') document.getElementById('f-wrong').classList.add('active');
    if (f === 'fav') document.getElementById('f-fav').classList.add('active');
    renderList();
  }

  function renderList() {
    const container = document.getElementById('word-list-container');
    const q = document.getElementById('search-bar').value.toLowerCase().trim();
    let targetWords = getFilteredRangeWords();

    if (currentFilter === 'wrong') targetWords = targetWords.filter(w => w.status === 'wrong');
    if (currentFilter === 'fav') targetWords = targetWords.filter(w => w.fav);

    if (q) {
      targetWords = targetWords.filter(w => w.word.toLowerCase().includes(q) || w.meaning.includes(q));
    }

    if (targetWords.length === 0) {
      container.innerHTML = `<div class="empty-state">조건에 부합하는 단어가 없습니다.</div>`;
      return;
    }

    let html = '';
    targetWords.forEach(w => {
      const globalIdx = words.findIndex(g => g.word === w.word && g.meaning === w.meaning);
      const isMemorized = w.status === 'known' ? 'memorized' : '';
      html += `
        <div class="word-card ${isMemorized}">
          <div class="word-info">
            <div class="word-header">
              <span class="word-text">${w.word}</span>
              ${w.pos ? `<span class="word-pos">${w.pos}</span>` : ''}
              ${w.fav ? `<span class="badge-fav">★</span>` : ''}
            </div>
            <div class="word-phonetic">${w.phonetic || ''}</div>
            <div class="word-meaning">${w.meaning}</div>
          </div>
          <div class="word-actions">
            <button class="action-btn" style="font-size:16px;" onclick="speak('${w.word.replace(/'/g, "\\'")}')">🔊</button>
            <button class="action-btn btn-fav ${w.fav ? 'active' : ''}" onclick="toggleFav(${globalIdx})">★</button>
            <button class="action-btn btn-check ${w.status === 'known' ? 'active' : ''}" onclick="toggleKnown(${globalIdx})">✔</button>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function toggleFav(gIdx) {
    words[gIdx].fav = !words[gIdx].fav;
    saveState();
    renderList();
  }

  function toggleKnown(gIdx) {
    words[gIdx].status = words[gIdx].status === 'known' ? '' : 'known';
    saveState();
    renderList();
  }

  /* 플래시카드 파트 */
  function initFlash() {
    flashWords = getFilteredRangeWords();
    flashIdx = 0;
    renderFlashCard();
  }

  function renderFlashCard() {
    const container = document.getElementById('flash-box');
    if (flashWords.length === 0) {
      container.innerHTML = `<div class="empty-state">해당 구간에 단어가 존재하지 않습니다.</div>`;
      return;
    }
    const w = flashWords[flashIdx];
    const globalIdx = words.findIndex(g => g.word === w.word && g.meaning === w.meaning);

    container.innerHTML = `
      <div class="flashcard" id="fc-card" onclick="revealFlashMeaning()">
        <button class="flash-speak-btn" onclick="handleFlashSpeak(event, '${w.word.replace(/'/g, "\\'")}')">🔊</button>
        <div class="flash-word">${w.word}</div>
        <div class="flash-phonetic">${w.phonetic || ''}</div>
        <div class="flash-meaning" id="fc-meaning">${w.meaning}</div>
      </div>
      <div class="flash-nav">
        <button class="flash-btn" onclick="flashMove(-1)">이전</button>
        <span>${flashIdx + 1} / ${flashWords.length}</span>
        <button class="flash-btn primary" onclick="flashMove(1)">다음</button>
      </div>
      <div style="display:flex; width:100%; gap:8px;">
        <button class="flash-btn" style="background:#EFF6FF; color:#2563EB;" onclick="setFlashStatus(${globalIdx}, 'known')">알아요 😊</button>
        <button class="flash-btn" style="background:#FEF2F2; color:#EF4444;" onclick="setFlashStatus(${globalIdx}, 'wrong')">모름 🤔</button>
      </div>
    `;

    // 터치 스와이프 이벤트 바인딩
    const cardEl = document.getElementById('fc-card');
    cardEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    cardEl.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) flashMove(1);
      if (touchEndX - touchStartX > 50) flashMove(-1);
    }, false);
  }

  function revealFlashMeaning() {
    const m = document.getElementById('fc-meaning');
    if(m && !m.classList.contains('show')) {
      m.classList.add('show');
      speak(flashWords[flashIdx].word);
    }
  }

  function handleFlashSpeak(e, text) {
    e.stopPropagation();
    speak(text);
  }

  function setFlashStatus(gIdx, status) {
    words[gIdx].status = status;
    saveState();
    flashMove(1);
  }

  function flashMove(dir) {
    flashIdx += dir;
    if (flashIdx < 0) flashIdx = 0;
    if (flashIdx >= flashWords.length) flashIdx = flashWords.length - 1;
    renderFlashCard();
  }

  /* 퀴즈 파트 */
  function initQuiz() {
    const base = getFilteredRangeWords();
    if (base.length < 4) {
      document.getElementById('quiz-box').innerHTML = `<div class="empty-state">퀴즈를 출제하려면 최소 4개 이상의 단어가 필요합니다. (현재 구간 단어 수: ${base.length}개)</div>`;
      return;
    }
    // 10문제 추출
    quizWords = [...base].sort(() => 0.5 - Math.random()).slice(0, 10);
    quizIdx = 0;
    quizScore = 0;
    quizLog = [];
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    const container = document.getElementById('quiz-box');
    const currentQ = quizWords[quizIdx];
    speak(currentQ.word);

    // 오답 보기 3개 추출
    let distracors = rawData.filter(w => w.meaning !== currentQ.meaning);
    distracors = distracors.sort(() => 0.5 - Math.random()).slice(0, 3);
    
    // 보기 4개 결합 및 셔플
    let options = [currentQ, ...distracors].sort(() => 0.5 - Math.random());

    container.innerHTML = `
      <div class="quiz-progress">
        <span>퀴즈 모드</span>
        <span>${quizIdx + 1} / ${quizWords.length}</span>
      </div>
      <div class="quiz-card">
        <div class="quiz-word">${currentQ.word}</div>
        <div style="color:var(--text-muted); font-size:12px; margin-bottom:10px;">${currentQ.phonetic || ''}</div>
      </div>
      <div class="quiz-options">
        ${options.map((opt, i) => `
          <button class="option-btn" onclick="submitAnswer(this, '${opt.meaning.replace(/'/g, "\\'")}', '${currentQ.meaning.replace(/'/g, "\\'")}')">
            ${i+1}. ${opt.meaning}
          </button>
        `).join('')}
      </div>
    `;
  }

  function submitAnswer(btn, chosen, correct) {
    // 버튼 중복 클릭 방지
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    const isCorrect = chosen === correct;
    const globalIdx = words.findIndex(g => g.word === quizWords[quizIdx].word && g.meaning === quizWords[quizIdx].meaning);

    if (isCorrect) {
      btn.classList.add('correct');
      quizScore++;
      if (globalIdx !== -1 && words[globalIdx].status === 'wrong') {
        words[globalIdx].status = '';
      }
    } else {
      btn.classList.add('wrong');
      if (globalIdx !== -1) words[globalIdx].status = 'wrong';
      // 맞는 정답 버튼 표기
      buttons.forEach(b => {
        if(b.innerText.includes(correct)) b.classList.add('correct');
      });
    }
    saveState();

    setTimeout(() => {
      quizIdx++;
      if (quizIdx < quizWords.length) {
        renderQuizQuestion();
      } else {
        renderQuizResult();
      }
    }, 1200);
  }

  function renderQuizResult() {
    const container = document.getElementById('quiz-box');
    let emoji = '😭';
    let msg = '조금 더 복습해볼까요? 할 수 있습니다!';
    const percent = (quizScore / quizWords.length) * 100;

    if (percent >= 90) { emoji = '👑'; msg = '완벽합니다! 씨유에탑의 자랑이군요!'; }
    else if (percent >= 70) { emoji = '😎'; msg = '훌륭한 성적입니다. 완벽을 향해 고고!'; }
    else if (percent >= 40) { emoji = '👍'; msg = '잘하고 있습니다. 틀린 단어들을 체크해보세요.'; }

    container.innerHTML = `
      <div class="quiz-result">
        <div class="result-emoji">${emoji}</div>
        <div class="result-score">${quizScore} / ${quizWords.length} 문제 맞춤</div>
        <div class="result-msg">${msg}</div>
        <button class="flash-btn primary" style="width:100%;" onclick="initQuiz()">다시 도전하기</button>
      </div>
    `;
  }

  window.onload = init;
</script>
</body>
</html>
